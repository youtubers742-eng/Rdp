# ============================================================
#  Free Windows Cloud PC — GitHub Actions + Tailscale
#  OS        : Windows Server 2022 (GitHub-hosted runner)
#  RAM       : 16 GB  (public repository)
#  Session   : up to 6 hours (GitHub limit)
#  Auth      : "key"  = Tailscale auth key from repository secret
#              "link" = interactive Tailscale login link in the log
#  Extras    : OmniRush downloaded (and installed) automatically
# ============================================================
name: Free Windows PC

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: 'Auth method: key = secret TAILSCALE_AUTH_KEY, link = interactive login URL'
        required: true
        default: 'key'
        type: choice
        options:
          - key
          - link
      rdp_password:
        description: 'RDP password (leave blank to auto-generate a strong one)'
        required: false
        default: ''
      install_omnirush:
        description: 'Download and silently install OmniRush on the desktop'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      # ----------------------------------------------------
      # 1. Enable Remote Desktop with NLA (secure)
      # ----------------------------------------------------
      - name: Enable Remote Desktop (NLA ON)
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "Remote Desktop enabled with NLA."

      # ----------------------------------------------------
      # 2. Create the RDP user and password
      # ----------------------------------------------------
      - name: Create RDP user
        shell: pwsh
        run: |
          $p = "${{ inputs.rdp_password }}"
          if ([string]::IsNullOrWhiteSpace($p)) {
            $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789@#%&'
            $p = -join (1..14 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          }
          $secure = ConvertTo-SecureString $p -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "RDP" -Password $secure
          } else {
            New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          "RDP_PASS=$p" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "RDP user ready."

      # ----------------------------------------------------
      # 3. Install Tailscale
      # ----------------------------------------------------
      - name: Install Tailscale
        shell: pwsh
        run: |
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i", $msi, "/quiet", "/norestart" -Wait
          Remove-Item $msi -Force
          Write-Host "Tailscale installed."

      # ----------------------------------------------------
      # 4. Connect Tailscale (key mode or interactive link)
      # ----------------------------------------------------
      - name: Connect Tailscale
        shell: pwsh
        run: |
          $ts   = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $mode = "${{ inputs.auth_mode }}"
          $host = "gh-pc-$env:GITHUB_RUN_ID"

          if ($mode -eq "link") {
            # Interactive mode: print a login URL, user clicks and signs in
            $out = "$env:TEMP\ts.out"
            $err = "$env:TEMP\ts.err"
            Remove-Item $out, $err -ErrorAction SilentlyContinue
            Start-Process -FilePath $ts -ArgumentList "up","--hostname=$host" `
                          -RedirectStandardOutput $out -RedirectStandardError $err -WindowStyle Hidden
            Start-Sleep -Seconds 20
            $log = @()
            if (Test-Path $out) { $log += Get-Content $out }
            if (Test-Path $err) { $log += Get-Content $err }
            $log | ForEach-Object { Write-Host $_ }
            $m = $log | Select-String -Pattern 'https://login\.tailscale\.com/\S+' | Select-Object -First 1
            if ($m) {
              Write-Host ""
              Write-Host "=========================================="
              Write-Host "  TAILSCALE LOGIN LINK"
              Write-Host "  $($m.Matches[0].Value)"
              Write-Host "  Open this link and sign in."
              Write-Host "=========================================="
              Write-Host ""
            }
          } else {
            # Key mode: use the reusable auth key stored as a secret
            & $ts up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=$host
          }

          # Wait for the Tailscale IP address (up to 5 minutes)
          $ip = $null
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 15
            $ip = & $ts ip -4 2>$null | Select-String -Pattern '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | Select-Object -First 1
            if ($ip) { break }
          }
          if ($ip) {
            Write-Host "Tailscale connected. IP: $ip"
          } else {
            Write-Host "No Tailscale IP yet."
            Write-Host "If you used 'key' mode: your auth key is invalid, expired or single-use."
            Write-Host "Fix: create a NEW key with 'Reusable' enabled, update the secret, then re-run."
            Write-Host "Or: re-run this workflow with auth_mode = link and sign in manually."
          }

      # ----------------------------------------------------
      # 5. OmniRush (download + silent install)
      # ----------------------------------------------------
      - name: Install OmniRush
        shell: pwsh
        continue-on-error: true
        run: |
          if ("${{ inputs.install_omnirush }}" -ne "yes") { Write-Host "Skipped."; exit 0 }
          $url = "https://github.com/omnirush-ai/omnirush-gui/releases/latest/download/omnirush-win-x64-2.2.17.exe"
          $exe = "$env:USERPROFILE\Desktop\OmniRush.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          Write-Host "OmniRush downloaded to Desktop."
          Start-Process -FilePath $exe -ArgumentList "/S" -Wait
          Write-Host "OmniRush installation finished."
          $shortcut = "$env:USERPROFILE\Desktop\OmniRush.lnk"
          $target = "$env:LOCALAPPDATA\Programs\omnirush\OmniRush.exe"
          if (-not (Test-Path $target)) {
            $found = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter "OmniRush.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $target = $found.FullName }
          }
          if (Test-Path $target) {
            $w = New-Object -ComObject WScript.Shell
            $s = $w.CreateShortcut($shortcut)
            $s.TargetPath = $target
            $s.Save()
            Write-Host "OmniRush desktop shortcut created."
          }

      # ----------------------------------------------------
      # 6. Keep the machine alive and print connection info
      # ----------------------------------------------------
      - name: Keep PC alive (connection info every 30s)
        shell: pwsh
        run: |
          $ts   = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $pass = $env:RDP_PASS
          $end  = (Get-Date).AddMinutes(348)
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "  WINDOWS CLOUD PC READY"
          Write-Host "=========================================="
          Write-Host ""
          while ((Get-Date) -lt $end) {
            $ip = & $ts ip -4 2>$null | Select-String -Pattern '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | Select-Object -First 1
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ADDRESS: $ip | USER: RDP | PASSWORD: $pass"
            Start-Sleep -Seconds 30
          }
          Write-Host "Session finished. Run the workflow again for a new PC."
