name: Windows VNC

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Kitne ghante chalana hai (1-6)"
        required: true
        default: "5"
        type: choice
        options: ["1", "2", "3", "4", "5", "6"]

jobs:
  pc:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 1 - TightVNC Install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $vncPass = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 8 | ForEach-Object { [char]$_ })
          "VNC_PASS=$vncPass" | Out-File -FilePath $env:GITHUB_ENV -Append

          $props = "SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=$vncPass SET_ALLOWLOOPBACK=1 VALUE_OF_ALLOWLOOPBACK=1 SET_LOOPBACKONLY=1 VALUE_OF_LOOPBACKONLY=1 SET_ACCEPTHTTPCONNECTIONS=1 VALUE_OF_ACCEPTHTTPCONNECTIONS=0"
          choco install tightvnc -y --no-progress --install-arguments="$props"
          Start-Sleep -Seconds 5

          $svc = Get-Service tvnserver -ErrorAction SilentlyContinue
          if (-not $svc) { Write-Host "[ERROR] TightVNC service nahi mili, install fail hua"; exit 1 }

          $reg = "HKLM:\SOFTWARE\TightVNC\Server"
          if (Test-Path $reg) {
            Set-ItemProperty -Path $reg -Name AllowLoopback -Value 1 -Type DWord
            Set-ItemProperty -Path $reg -Name LoopbackOnly -Value 1 -Type DWord
          }
          Restart-Service tvnserver -Force

          $ok = $false
          for ($i = 0; $i -lt 15 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try {
              $c = New-Object Net.Sockets.TcpClient
              $c.Connect("127.0.0.1", 5900)
              $s = $c.GetStream()
              $s.ReadTimeout = 4000
              $b = New-Object byte[] 12
              $n = $s.Read($b, 0, 12)
              $banner = [Text.Encoding]::ASCII.GetString($b, 0, $n)
              $hello = [Text.Encoding]::ASCII.GetBytes("RFB 003.008" + [char]10)
              $s.Write($hello, 0, $hello.Length)
              $t = New-Object byte[] 1
              $null = $s.Read($t, 0, 1)
              $c.Close()
              if ($banner.StartsWith("RFB") -and $t[0] -gt 0) { $ok = $true }
            } catch { }
          }
          if ($ok) { Write-Host "[OK] VNC server chal raha hai aur connection accept kar raha hai"; exit 0 }
          else { Write-Host "[ERROR] VNC server connection accept nahi kar raha"; exit 1 }

      - name: 2 - Files Download (noVNC, websockify, Caddy, cloudflared)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip" -OutFile "$env:RUNNER_TEMP\novnc.zip"
          Expand-Archive "$env:RUNNER_TEMP\novnc.zip" -DestinationPath "C:\" -Force
          if (-not (Test-Path "C:\noVNC-1.5.0\vnc.html")) { Write-Host "[ERROR] noVNC files nahi mile"; exit 1 }
          Write-Host "[OK] noVNC mil gaya"

          python -m pip install --quiet websockify
          python -c "import websockify"
          if ($LASTEXITCODE -ne 0) { Write-Host "[ERROR] websockify install fail"; exit 1 }
          Write-Host "[OK] websockify mil gaya"

          Invoke-WebRequest -Uri "https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_windows_amd64.zip" -OutFile "$env:RUNNER_TEMP\caddy.zip"
          Expand-Archive "$env:RUNNER_TEMP\caddy.zip" -DestinationPath "C:\caddy" -Force
          if (-not (Test-Path "C:\caddy\caddy.exe")) { Write-Host "[ERROR] caddy.exe nahi mila"; exit 1 }
          Write-Host "[OK] Caddy mil gaya"

          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe"
          if (-not (Test-Path "C:\cloudflared.exe")) { Write-Host "[ERROR] cloudflared nahi mila"; exit 1 }
          Write-Host "[OK] cloudflared mil gaya"

          $caddyfile = @(
            '{',
            '  admin off',
            '  auto_https off',
            '}',
            ':8080 {',
            '  handle /websockify* {',
            '    reverse_proxy 127.0.0.1:6080',
            '  }',
            '  handle {',
            '    root * C:/noVNC-1.5.0',
            '    encode gzip',
            '    @js path_regexp \.m?js$',
            '    @css path_regexp \.css$',
            '    header @js Content-Type text/javascript',
            '    header @css Content-Type text/css',
            '    file_server',
            '  }',
            '}'
          )
          Set-Content -Path "C:\Caddyfile" -Value $caddyfile
          exit 0

      - name: 3 - Run + Tunnels + Zinda Rakho (link yahin ke log me aayega)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $pw = $env:VNC_PASS
          $end = (Get-Date).AddMinutes([int]"${{ inputs.hours }}" * 60)
          $global:cfProc = $null
          $global:cfUrl = $null
          $global:lhrProc = $null
          $global:lhrUrl = $null

          function Test-Port($port) {
            try { $c = New-Object Net.Sockets.TcpClient; $c.Connect("127.0.0.1", $port); $c.Close(); return $true } catch { return $false }
          }

          function Test-Url($u) {
            try { $r = Invoke-WebRequest "$u/vnc.html" -UseBasicParsing -TimeoutSec 10; return ($r.StatusCode -eq 200) } catch { return $false }
          }

          function Wait-Url($u, $tries) {
            for ($j = 0; $j -lt $tries; $j++) {
              Start-Sleep -Seconds 3
              if (Test-Url $u) { return $true }
            }
            return $false
          }

          function Test-Ws($uri) {
            for ($k = 0; $k -lt 3; $k++) {
              try {
                $ws = New-Object System.Net.WebSockets.ClientWebSocket
                $ws.Options.AddSubProtocol("binary")
                $cts = New-Object System.Threading.CancellationTokenSource 10000
                $ws.ConnectAsync([Uri]$uri, $cts.Token).GetAwaiter().GetResult()
                $buf = New-Object byte[] 64
                $res = $ws.ReceiveAsync([ArraySegment[byte]]::new($buf), $cts.Token).GetAwaiter().GetResult()
                $txt = [Text.Encoding]::ASCII.GetString($buf, 0, $res.Count)
                $ws.Dispose()
                if ($txt.StartsWith("RFB")) { return $true }
              } catch { }
              Start-Sleep -Seconds 2
            }
            return $false
          }

          function Start-Websockify {
            $id = Get-Random
            Start-Process -FilePath "python" -ArgumentList "-m", "websockify", "127.0.0.1:6080", "127.0.0.1:5900" -WindowStyle Hidden -RedirectStandardOutput "C:\ws-$id.log" -RedirectStandardError "C:\ws-$id.err.log"
          }

          function Start-Caddy {
            $id = Get-Random
            Start-Process -FilePath "C:\caddy\caddy.exe" -ArgumentList "run", "--config", "C:\Caddyfile", "--adapter", "caddyfile" -WindowStyle Hidden -RedirectStandardOutput "C:\caddy-$id.log" -RedirectStandardError "C:\caddy-$id.err.log"
          }

          function Start-Cf($proto) {
            if ($global:cfProc) { Stop-Process -Id $global:cfProc.Id -Force -ErrorAction SilentlyContinue }
            $global:cfUrl = $null
            $id = Get-Random
            $log = "C:\cf-$id.log"
            $global:cfProc = Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList "tunnel", "--no-autoupdate", "--protocol", $proto, "--url", "http://127.0.0.1:8080" -WindowStyle Hidden -PassThru -RedirectStandardOutput "C:\cf-$id.out.log" -RedirectStandardError $log
            $url = $null
            $reg = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path $log) {
                if (-not $url) {
                  $m = Select-String -Path $log -Pattern "https://(?!api\.)[a-z0-9-]+\.trycloudflare\.com" -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($m) { $url = $m.Matches[0].Value }
                }
                if (-not $reg) {
                  if (Select-String -Path $log -Pattern "Registered tunnel connection" -Quiet -ErrorAction SilentlyContinue) { $reg = $true }
                }
              }
              if ($url -and $reg) { break }
            }
            if ($url -and $reg -and (Wait-Url $url 15)) { $global:cfUrl = $url; return }
            Write-Host "[WARN] Cloudflare ($proto) fail hua. log:"
            if (Test-Path $log) { Get-Content $log -Tail 8 | Out-Host }
            Stop-Process -Id $global:cfProc.Id -Force -ErrorAction SilentlyContinue
          }

          function Start-Lhr {
            if ($global:lhrProc) { Stop-Process -Id $global:lhrProc.Id -Force -ErrorAction SilentlyContinue }
            $global:lhrUrl = $null
            $id = Get-Random
            $o = "C:\lhr-$id.out.log"
            $e = "C:\lhr-$id.err.log"
            $global:lhrProc = Start-Process -FilePath "ssh" -ArgumentList "-T", "-o", "StrictHostKeyChecking=no", "-o", "UserKnownHostsFile=NUL", "-o", "ServerAliveInterval=30", "-o", "ExitOnForwardFailure=yes", "-R", "80:127.0.0.1:8080", "nokey@localhost.run" -WindowStyle Hidden -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
            $url = $null
            for ($i = 0; $i -lt 20 -and -not $url; $i++) {
              Start-Sleep -Seconds 2
              foreach ($f in @($o, $e)) {
                if (-not $url -and (Test-Path $f)) {
                  $m = Select-String -Path $f -Pattern "https://[a-z0-9]+\.lhr\.life" -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($m) { $url = $m.Matches[0].Value }
                }
              }
            }
            if ($url -and (Wait-Url $url 10)) { $global:lhrUrl = $url; return }
            Write-Host "[WARN] localhost.run link nahi bana"
            Stop-Process -Id $global:lhrProc.Id -Force -ErrorAction SilentlyContinue
          }

          function Show-Links {
            Write-Host ""
            Write-Host "=================================================="
            Write-Host " VNC PASSWORD: $pw (links me already laga hai)"
            if ($global:cfUrl) {
              $l = "$($global:cfUrl)/vnc.html?autoconnect=true&resize=scale&password=$pw"
              Write-Host " LINK 1 (Cloudflare): $l"
              Write-Host "::notice title=VNC Link 1::$l"
            }
            if ($global:lhrUrl) {
              $l = "$($global:lhrUrl)/vnc.html?autoconnect=true&resize=scale&password=$pw"
              Write-Host " LINK 2 (localhost.run): $l"
              Write-Host "::notice title=VNC Link 2::$l"
            }
            Write-Host "=================================================="
            Write-Host ""
          }

          # ---- 1. local servers ----
          Start-Websockify
          Start-Caddy
          $page = $false
          for ($i = 0; $i -lt 20 -and -not $page; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8080/vnc.html" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $page = $true }
            } catch { }
          }
          if (-not $page) {
            Write-Host "[ERROR] noVNC page local pe nahi khula"
            Get-ChildItem "C:\caddy-*.err.log" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 20 }
            exit 1
          }
          Write-Host "[OK] noVNC page local pe khul gaya"

          try {
            $js = Invoke-WebRequest "http://127.0.0.1:8080/core/rfb.js" -UseBasicParsing -TimeoutSec 10
            Write-Host "[INFO] rfb.js content-type: $($js.Headers['Content-Type'] -join ',')"
          } catch { Write-Host "[WARN] rfb.js nahi khula" }

          if (Test-Ws "ws://127.0.0.1:8080/websockify") {
            Write-Host "[OK] noVNC -> websocket -> VNC poori chain chal rahi hai"
          } else {
            Write-Host "[ERROR] websocket chain fail hui"
            Get-ChildItem "C:\ws-*.err.log" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 20 }
            exit 1
          }

          # ---- 2. tunnels ----
          foreach ($proto in @("http2", "quic", "http2")) {
            if (-not $global:cfUrl) { Start-Cf $proto }
          }
          Start-Lhr

          if (-not $global:cfUrl -and -not $global:lhrUrl) { Write-Host "[ERROR] Koi bhi tunnel nahi bana"; exit 1 }

          foreach ($pair in @(@("Cloudflare", $global:cfUrl), @("localhost.run", $global:lhrUrl))) {
            if ($pair[1]) {
              $wsOk = Test-Ws (($pair[1] -replace '^https', 'wss') + "/websockify")
              Write-Host "[INFO] $($pair[0]) websocket chal raha hai: $wsOk"
            }
          }
          Show-Links

          # ---- 3. zinda rakho + watchdog ----
          $n = 0
          $cfFail = 0
          $lhrFail = 0
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
            $n++
            $changed = $false

            if ((Get-Service tvnserver).Status -ne 'Running') { Start-Service tvnserver }
            if (-not (Test-Port 6080)) { Write-Host "[WARN] websockify band tha, restart"; Start-Websockify }
            if (-not (Test-Port 8080)) { Write-Host "[WARN] Caddy band tha, restart"; Start-Caddy }

            if ($global:cfUrl) {
              if (($null -eq $global:cfProc) -or $global:cfProc.HasExited -or -not (Test-Url $global:cfUrl)) { $cfFail++ } else { $cfFail = 0 }
              if ($cfFail -ge 2) { Write-Host "[WARN] Cloudflare tunnel gir gaya, naya bana raha hu"; Start-Cf "http2"; $cfFail = 0; $changed = $true }
            } elseif ($n % 5 -eq 0) {
              Start-Cf "http2"
              if ($global:cfUrl) { $changed = $true }
            }

            if ($global:lhrUrl) {
              if (($null -eq $global:lhrProc) -or $global:lhrProc.HasExited -or -not (Test-Url $global:lhrUrl)) { $lhrFail++ } else { $lhrFail = 0 }
              if ($lhrFail -ge 2) { Write-Host "[WARN] localhost.run tunnel gir gaya, naya bana raha hu"; Start-Lhr; $lhrFail = 0; $changed = $true }
            } elseif ($n % 5 -eq 0) {
              Start-Lhr
              if ($global:lhrUrl) { $changed = $true }
            }

            Write-Host "PC chal raha hai... $n minute"
            if ($changed -or ($n % 5 -eq 0)) { Show-Links }
          }
          Write-Host "Time khatam. PC band ho raha hai."
          exit 0
