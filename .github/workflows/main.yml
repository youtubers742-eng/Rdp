
# ============================================================
name: Free Windows PC (Tailscale RDP)

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: "RDP password (khali chhod do to khud ban jayega)"
        required: false
        default: ""
      download_url:
        description: "OPTIONAL: kisi bhi file ka direct link (jaise OmniRush installer) — Desktop par auto-download"
        required: false
        default: ""

jobs:
  cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 355          # 5 ghante 55 min, phir khud band (safe side)

    steps:
      # ---------- 1. RDP ON karo (NLA ke saath = secure) ----------
      - name: Enable Remote Desktop (NLA ON)
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "RDP enabled with NLA."

      # ---------- 2. User + Password banao ----------
      - name: Create RDP user
        shell: pwsh
        run: |
          $p = "${{ inputs.rdp_password }}"
          if ([string]::IsNullOrWhiteSpace($p)) {
            $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789@#%&'
            $p = -join (1..14 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          }
          $secure = ConvertTo-SecureString $p -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "RDP" -Password $secure
          } else {
            New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          "RDP_PASS=$p" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "User ready."

      # ---------- 3. Tailscale install ----------
      - name: Install Tailscale
        shell: pwsh
        run: |
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i", $msi, "/quiet", "/norestart" -Wait
          Remove-Item $msi -Force
          Write-Host "Tailscale installed."

      # ---------- 4. Tailscale connect ----------
      - name: Connect Tailscale
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-pc-$env:GITHUB_RUN_ID
          $ip = $null
          for ($i = 0; $i -lt 20 -and -not $ip; $i++) {
            Start-Sleep -Seconds 5
            $ip = & $ts ip -4
          }
          if (-not $ip) { Write-Error "Tailscale IP nahi mila."; exit 1 }
          "TS_IP=$ip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Tailscale IP: $ip"

      # ---------- 5. Chrome install (optional, fail ho to bhi chalta rahe) ----------
      - name: Install Chrome
        shell: pwsh
        continue-on-error: true
        run: |
          winget install -e --id Google.Chrome --silent --accept-package-agreements --accept-source-agreements

      # ---------- 6. OPTIONAL: apni file auto-download (OmniRush wagara) ----------
      - name: Download your file to Desktop
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "${{ inputs.download_url }}"
          if ([string]::IsNullOrWhiteSpace($url)) { Write-Host "Koi link nahi diya — skip."; exit 0 }
          $out = "$env:USERPROFILE\Desktop\" + [System.IO.Path]::GetFileName($url.Split('?')[0])
          if ($out -notmatch '\.[a-zA-Z0-9]+$') { $out = "$env:USERPROFILE\Desktop\myfile.exe" }
          Invoke-WebRequest -Uri $url -OutFile $out
          Write-Host "Downloaded to Desktop: $out"

      # ---------- 7. Details dikhao ----------
      - name: SHOW CONNECTION DETAILS
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "   PC READY — ABHI CONNECT KAR"
          Write-Host "=========================================="
          Write-Host "  Address  : $env:TS_IP"
          Write-Host "  Username : RDP"
          Write-Host "  Password : $env:RDP_PASS"
          Write-Host "=========================================="
          Write-Host "  Windows App khol -> PC name me Address paste kar"
          Write-Host ""

      # ---------- 8. PC ko zinda rakho ----------
      - name: Keep PC alive
        shell: pwsh
        run: |
          $end = (Get-Date).AddMinutes(350)
          while ((Get-Date) -lt $end) {
            Write-Host "[$(Get-Date -Format 'HH:mm')] PC chal raha hai... ($env:TS_IP)"
            Start-Sleep -Seconds 300
          }
          Write-Host "Session khatam. Naya PC chahiye to dobara Run workflow daba."
          
