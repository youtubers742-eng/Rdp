# ============================================================
#  WINUX — Windows 11 jaisa Linux desktop
#  GitHub Actions "Run workflow" se chalu hota hai
# ============================================================
#  Kya milta hai:
#    - Ubuntu + XFCE4 + Win11 GTK theme (dark) + Win11 icons + Win11 cursor
#    - Windows 11 jaisa BOTTOM CENTERED taskbar + Start menu
#    - RDP (Tailscale) + BROWSER ACCESS (noVNC, koi client nahi)
#    - Chrome, VS Code, VLC, Node, Python, Git, FFmpeg, Wine (.exe chalega)
#    - Live countdown
#
#  SECRET: TAILSCALE_AUTH_KEY -> sirf "tskey-auth-..." wali
# ============================================================

name: Winux Cloud PC

on:
  workflow_dispatch:
    inputs:

      # ---------- SABSE ZAROORI: TIME ----------
      hours:
        description: '[1] Kitne ghante chalu rakhe? (max 5.5)'
        required: true
        default: '5'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

      # ---------- LOOK ----------
      theme:
        description: '[2] Windows look — win11 / win10 / plain'
        required: true
        default: 'win11'
        type: choice
        options:
          - win11
          - win10
          - plain

      wallpaper:
        description: '[3] Windows 11 wallpaper?'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

      resolution:
        description: '[4] Screen size'
        required: true
        default: '1600x900'
        type: choice
        options:
          - '1280x720'
          - '1600x900'
          - '1920x1080'

      # ---------- SOFTWARE ----------
      software_pack:
        description: '[5] Software pack'
        required: true
        default: 'essential'
        type: choice
        options:
          - none
          - essential
          - dev
          - media
          - all

      install_wine:
        description: '[6] Wine (.exe files chalane ke liye)?'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

      # ---------- CONNECTION ----------
      auth_mode:
        description: '[7] Tailscale: auto / key / link'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - key
          - link

      pc_password:
        description: '[8] Desktop password (khali = khud banega)'
        required: false
        default: ''

      browser_access:
        description: '[9] Browser se desktop (noVNC — koi client nahi)?'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  winux:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      DEBIAN_FRONTEND: noninteractive
      THEME:      ${{ inputs.theme }}
      WALL:       ${{ inputs.wallpaper }}
      RES:        ${{ inputs.resolution }}
      PACK:       ${{ inputs.software_pack }}
      WINE:       ${{ inputs.install_wine }}
      HOURS:      ${{ inputs.hours }}
      BROWSER:    ${{ inputs.browser_access }}
      AUTH_MODE:  ${{ inputs.auth_mode }}

    steps:
      # ============================================================
      # 1. Machine info + password
      # ============================================================
      - name: '[1/12] Machine info + password'
        shell: bash
        run: |
          echo "=== WINUX CLOUD PC ==="
          nproc
          free -h | head -2
          df -h / | tail -1
          lsb_release -d 2>/dev/null || cat /etc/os-release | grep PRETTY

          # password
          PW="${{ inputs.pc_password }}"
          if [ -z "$PW" ]; then
            PW=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 12)
          fi
          echo "$PW" > /tmp/PW
          echo "runner:$PW" | sudo chpasswd
          echo "PW_LEN=${#PW}"
          echo "PC_PASSWORD=$PW" >> $GITHUB_ENV
          echo "PC_USER=runner"  >> $GITHUB_ENV

      # ============================================================
      # 2. XFCE desktop + XRDP
      # ============================================================
      - name: '[2/12] XFCE + XRDP install'
        shell: bash
        run: |
          sudo apt-get update -qq
          # ZAROORI (ye fail hone nahi chahiye)
          sudo apt-get install -y -qq \
            xfce4 xfce4-goodies xfce4-terminal \
            xrdp xorgxrdp dbus-x11 \
            xvfb x11vnc novnc websockify \
            curl wget git unzip
          # OPTIONAL (fail ho to koi baat nahi)
          sudo apt-get install -y -qq fonts-noto 2>/dev/null || true
          sudo apt-get install -y -qq fonts-inter 2>/dev/null || true
          sudo apt-get install -y -qq xfce4-whiskermenu-plugin 2>/dev/null || true
          sudo apt-get install -y -qq xfce4-statusnotifier-plugin 2>/dev/null || true
          sudo apt-get install -y -qq imagemagick 2>/dev/null || true
          # headless ke liye zaroori
          echo "allowed_users=anybody" | sudo tee /etc/X11/Xwrapper.config > /dev/null
          sudo adduser xrdp ssl-cert 2>/dev/null || true
          echo "exec startxfce4" > "$HOME/.xsession"
          chmod +x "$HOME/.xsession"
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sleep 3
          sudo systemctl is-active xrdp || (sudo xrdp -nodaemon & sleep 3)
          echo "XRDP ready"

      # ============================================================
      # 3. WINDOWS 11 THEME
      # ============================================================
      - name: '[3/12] Windows theme lagao'
        shell: bash
        continue-on-error: true
        run: |
          if [ "$THEME" = "plain" ]; then
            echo "plain mode — theme skip"; exit 0
          fi
          sudo apt-get install -y -qq sassc gtk2-engines-murrine libglib2.0-dev-bin 2>/dev/null || true
          cd /tmp

          if [ "$THEME" = "win11" ]; then
            echo "--- Win11 GTK theme ---"
            git clone --depth 1 https://github.com/yeyushengfan258/Win11-gtk-theme.git 2>/dev/null || true
            if [ -d Win11-gtk-theme ]; then
              cd Win11-gtk-theme
              # dark + rounded windows, Windows start icon
              sudo ./install.sh -c dark --tweaks round -i default 2>&1 | tail -5
              cd /tmp
            fi
            echo "--- Win11 icons ---"
            git clone --depth 1 https://github.com/yeyushengfan258/Win11-icon-theme.git 2>/dev/null || true
            if [ -d Win11-icon-theme ]; then
              cd Win11-icon-theme && sudo ./install.sh 2>&1 | tail -3; cd /tmp
            fi
            echo "--- Win11 cursor ---"
            git clone --depth 1 https://github.com/yeyushengfan258/Win11-cursor.git 2>/dev/null || true
            if [ -d Win11-cursor ]; then
              cd Win11-cursor && sudo ./install.sh 2>&1 | tail -3; cd /tmp
            fi
            GTK_THEME_NAME="Win11-dark"
            ICON_THEME_NAME="Win11"
            CURSOR_THEME="Win11"
          else
            echo "--- Windows 10 theme (B00merang) ---"
            git clone --depth 1 https://github.com/B00merang-Project/Windows-10.git 2>/dev/null || true
            if [ -d Windows-10 ]; then
              mkdir -p ~/.themes ~/.icons
              cp -r Windows-10/* ~/.themes/ 2>/dev/null || true
              cp -r Windows-10-Icons/* ~/.icons/ 2>/dev/null || true
            fi
            GTK_THEME_NAME="Windows10Dark"
            ICON_THEME_NAME="Windows-10-Icons"
            CURSOR_THEME="DMZ-White"
          fi

          # ---- XFCE settings ----
          mkdir -p ~/.config/xfce4/xfconf/xfce-perchannel-xml

          # GTK theme + icons + cursor + font
          xfconf-query -c xsettings -p /Net/ThemeName       -s "$GTK_THEME_NAME" --create -t string 2>/dev/null || true
          xfconf-query -c xsettings -p /Net/IconThemeName   -s "$ICON_THEME_NAME" --create -t string 2>/dev/null || true
          xfconf-query -c xsettings -p /Gtk/CursorThemeName -s "$CURSOR_THEME"    --create -t string 2>/dev/null || true
          xfconf-query -c xsettings -p /Gtk/FontName        -s "Inter 10"          --create -t string 2>/dev/null || true
          xfconf-query -c xsettings -p /Gtk/DecorationLayout -s "menu:minimize,maximize,close" --create -t string 2>/dev/null || true
          xfconf-query -c xsettings -p /Net/EnableEventSounds -s false --create -t bool 2>/dev/null || true

          # window manager theme
          xfconf-query -c xfwm4 -p /general/theme       -s "$GTK_THEME_NAME" --create -t string 2>/dev/null || true
          xfconf-query -c xfwm4 -p /general/title_font  -s "Inter Bold 10"   --create -t string 2>/dev/null || true
          xfconf-query -c xfwm4 -p /general/button_layout -s "O|HMC"         --create -t string 2>/dev/null || true

          # ---- DIRECT XML FALLBACK (headless pe xfconf-query fail ho sakta hai) ----
          XD="$HOME/.config/xfce4/xfconf/xfce-perchannel-xml"
          mkdir -p "$XD"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<channel name="xsettings" version="1.0">' \
            '  <property name="Net" type="empty">' \
            '    <property name="ThemeName" type="string" value="$GTK_THEME_NAME"/>' \
            '    <property name="IconThemeName" type="string" value="$ICON_THEME_NAME"/>' \
            '    <property name="EnableEventSounds" type="bool" value="false"/>' \
            '  </property>' \
            '  <property name="Gtk" type="empty">' \
            '    <property name="CursorThemeName" type="string" value="$CURSOR_THEME"/>' \
            '    <property name="FontName" type="string" value="Sans 10"/>' \
            '  </property>' \
            '</channel>' \
            > "$XD/xsettings.xml"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<channel name="xfwm4" version="1.0">' \
            '  <property name="general" type="empty">' \
            '    <property name="theme" type="string" value="$GTK_THEME_NAME"/>' \
            '    <property name="button_layout" type="string" value="O|HMC"/>' \
            '    <property name="workspace_count" type="int" value="1"/>' \
            '  </property>' \
            '</channel>' \
            > "$XD/xfwm4.xml"
          echo "theme done: $GTK_THEME_NAME / $ICON_THEME_NAME (xml + xfconf dono)"

      # ============================================================
      # 4. WINDOWS 11 TASKBAR (bottom + centered)
      # ============================================================
      - name: '[4/12] Windows jaisa taskbar'
        shell: bash
        continue-on-error: true
        run: |
          # panel: bottom, full width, 42px, transparent-ish
          xfconf-query -c xfce4-panel -p /panels/panel-1/position        -s "p=6;x=0;y=0" --create -t string 2>/dev/null || true
          xfconf-query -c xfce4-panel -p /panels/panel-1/length          -s 100 --create -t int    2>/dev/null || true
          xfconf-query -c xfce4-panel -p /panels/panel-1/size            -s 42  --create -t int    2>/dev/null || true
          xfconf-query -c xfce4-panel -p /panels/panel-1/background-style -s 1  --create -t int    2>/dev/null || true
          xfconf-query -c xfce4-panel -p /panels/panel-1/enter-opacity   -s 92  --create -t int    2>/dev/null || true

          # plugin 1: Start menu (whisker) — Windows logo, no title
          xfconf-query -c xfce4-panel -p /plugins/plugin-1 -s "whiskermenu" --create -t string 2>/dev/null || true
          xfconf-query -c xfce4-panel -p /plugins/plugin-1/show-button-title -s false --create -t bool 2>/dev/null || true
          xfconf-query -c xfce4-panel -p /plugins/plugin-1/button-icon -s "/usr/share/icons/Win11/256x256/places/start-here.png" --create -t string 2>/dev/null || true

          # plugin 2: expanding separator (icons ko center karta hai)
          xfconf-query -c xfce4-panel -p /plugins/plugin-2 -s "separator" --create -t string 2>/dev/null || true
          xfconf-query -c xfce4-panel -p /plugins/plugin-2/expand -s true --create -t bool 2>/dev/null || true
          xfconf-query -c xfce4-panel -p /plugins/plugin-2/style  -s 0    --create -t int   2>/dev/null || true

          # plugin 3: tasklist (Windows jaisa — sirf icons)
          xfconf-query -c xfce4-panel -p /plugins/plugin-3 -s "tasklist" --create -t string 2>/dev/null || true
          xfconf-query -c xfce4-panel -p /plugins/plugin-3/show-labels      -s false --create -t bool 2>/dev/null || true
          xfconf-query -c xfce4-panel -p /plugins/plugin-3/grouping         -s 1     --create -t int   2>/dev/null || true
          xfconf-query -c xfce4-panel -p /plugins/plugin-3/flat-buttons     -s true  --create -t bool 2>/dev/null || true
          xfconf-query -c xfce4-panel -p /plugins/plugin-3/show-handle      -s false --create -t bool 2>/dev/null || true
          xfconf-query -c xfce4-panel -p /plugins/plugin-3/include-all-workspaces -s false --create -t bool 2>/dev/null || true

          # plugin 4: expanding separator
          xfconf-query -c xfce4-panel -p /plugins/plugin-4 -s "separator" --create -t string 2>/dev/null || true
          xfconf-query -c xfce4-panel -p /plugins/plugin-4/expand -s true --create -t bool 2>/dev/null || true
          xfconf-query -c xfce4-panel -p /plugins/plugin-4/style  -s 0    --create -t int   2>/dev/null || true

          # plugin 5: systray
          xfconf-query -c xfce4-panel -p /plugins/plugin-5 -s "systray" --create -t string 2>/dev/null || true

          # plugin 6: clock (Windows format)
          xfconf-query -c xfce4-panel -p /plugins/plugin-6 -s "clock" --create -t string 2>/dev/null || true
          xfconf-query -c xfce4-panel -p /plugins/plugin-6/digital-format -s "%H:%M%n%d/%m/%Y" --create -t string 2>/dev/null || true
          xfconf-query -c xfce4-panel -p /plugins/plugin-6/tooltip-format  -s "%A, %d %B %Y" --create -t string 2>/dev/null || true

          # plugin list set karo
          xfconf-query -c xfce4-panel -p /panels/panel-1/plugin-ids \
            -t int -s 1 -t int -s 2 -t int -s 3 -t int -s 4 -t int -s 5 -t int -s 6 --force-array 2>/dev/null || true

          echo "taskbar done (bottom, centered)"

      # ============================================================
      # 5. WALLPAPER
      # ============================================================
      - name: '[5/12] Windows wallpaper'
        if: inputs.wallpaper == 'yes'
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p ~/Pictures
          # Windows 11 jaisa gradient wallpaper (koi external image nahi)
          which convert >/dev/null 2>&1 || sudo apt-get install -y -qq imagemagick 2>/dev/null || true
          if which convert >/dev/null 2>&1; then
            convert -size 1920x1080 gradient:'#0b2a4a-#1b4f8a' \
              -swirl 180 -blur 0x8 -quality 95 ~/Pictures/win11.png 2>/dev/null || \
            convert -size 1920x1080 gradient:'#0b2a4a-#1b4f8a' ~/Pictures/win11.png 2>/dev/null || true
          fi
          if [ -f ~/Pictures/win11.png ]; then
            xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/image-path -s "$HOME/Pictures/win11.png" --create -t string 2>/dev/null || true
            xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/image-style -s 5 --create -t int 2>/dev/null || true
            echo "wallpaper set"
          fi

      # ============================================================
      # 6. SOFTWARE
      # ============================================================
      - name: '[6/12] Software install'
        shell: bash
        continue-on-error: true
        run: |
          sudo apt-get update -qq

          if [ "$PACK" = "essential" ] || [ "$PACK" = "all" ]; then
            echo "--- essential ---"
            # Chrome
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq /tmp/chrome.deb 2>&1 | tail -2 || true
            sudo apt-get install -y -qq p7zip-full vlc gedit file-roller 2>&1 | tail -2 || true
          fi

          if [ "$PACK" = "dev" ] || [ "$PACK" = "all" ]; then
            echo "--- dev ---"
            # VS Code
            wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /tmp/ms.gpg
            sudo install -o root -g root -m 644 /tmp/ms.gpg /etc/apt/trusted.gpg.d/
            echo "deb [arch=amd64] https://packages.microsoft.com/repos/code stable main" | sudo tee /etc/apt/sources.list.d/vscode.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq code 2>&1 | tail -2 || true
            sudo apt-get install -y -qq python3-pip nodejs npm ffmpeg 2>&1 | tail -2 || true
          fi

          if [ "$PACK" = "media" ] || [ "$PACK" = "all" ]; then
            echo "--- media ---"
            sudo apt-get install -y -qq ffmpeg vlc gimp audacity obs-studio imagemagick handbrake 2>&1 | tail -2 || true
          fi

          echo "software done"

      # ============================================================
      # 7. WINE (.exe chalane ke liye)
      # ============================================================
      - name: '[7/12] Wine install (.exe chalega)'
        if: inputs.install_wine == 'yes'
        shell: bash
        continue-on-error: true
        run: |
          sudo dpkg --add-architecture i386 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 wine32 2>&1 | tail -3 || \
            sudo apt-get install -y -qq wine64 2>&1 | tail -3 || true
          wine --version 2>/dev/null || echo "wine optional — skip"

      # ============================================================
      # 8. VIRTUAL DISPLAY + noVNC (browser access)
      # ============================================================
      - name: '[8/12] Virtual display + noVNC'
        shell: bash
        continue-on-error: true
        run: |
          RES="${{ inputs.resolution }}"
          W=$(echo $RES | cut -d'x' -f1); H=$(echo $RES | cut -d'x' -f2)
          echo "display: ${W}x${H}"

          rm -rf /tmp/.X99-lock
          nohup Xvfb :99 -screen 0 ${W}x${H}x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          sleep 4

          export DISPLAY=:99
          nohup startxfce4 > /tmp/xfce.log 2>&1 &
          sleep 8

          # VNC server on the virtual display
          nohup x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -quiet > /tmp/x11vnc.log 2>&1 &
          sleep 3

          # noVNC (browser se)
          nohup websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 3

          echo "display + novnc ready on :99"

      # ============================================================
      # 9. TAILSCALE
      # ============================================================
      - name: '[9/12] Tailscale install'
        shell: bash
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh 2>&1 | tail -3
          echo "tailscale installed"

      - name: '[9b/12] Tailscale key check'
        shell: bash
        run: |
          K="${{ secrets.TAILSCALE_AUTH_KEY }}"
          MODE="${{ inputs.auth_mode }}"
          echo "=========================================="
          echo "  TAILSCALE KEY CHECK"
          echo "=========================================="
          if [ -z "$K" ]; then
            echo "  [!] TAILSCALE_AUTH_KEY secret KHALI hai -> link mode"
            echo "TS_MODE=link" >> $GITHUB_ENV
          elif ! echo "$K" | grep -q '^tskey-auth-'; then
            echo "  [!] GALAT KEY TYPE (tskey-api- nahi chalega) -> link mode"
            echo "TS_MODE=link" >> $GITHUB_ENV
          elif [ ${#K} -lt 30 ]; then
            echo "  [!] Key adhura hai -> link mode"
         echo "TS_MODE=link" >> $GITHUB_ENV
          elif [ "$MODE" = "link" ]; then
            echo "TS_MODE=link" >> $GITHUB_ENV
          else
            echo "  [OK] Key format sahi hai"
            echo "TS_MODE=key" >> $GITHUB_ENV
          fi
          echo "=========================================="

      - name: '[9c/12] Connect Tailscale (key)'
        if: env.TS_MODE == 'key'
        shell: bash
        run: |
          sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="winux-$GITHUB_RUN_ID" --accept-routes 2>&1 | tail -5 || true
          sleep 10
          if sudo tailscale status 2>&1 | grep -qi 'Logged out\|NeedsLogin'; then
            echo "  [FAIL] key kaam nahi kiya"
            echo "TS_NEED_LINK=true" >> $GITHUB_ENV
          else
            echo "  [OK] connected"
            echo "TS_NEED_LINK=false" >> $GITHUB_ENV
          fi

      - name: '[9d/12] Connect Tailscale (login link)'
        if: env.TS_MODE == 'link' || env.TS_NEED_LINK == 'true'
        shell: bash
        run: |
          sudo tailscale up --hostname="winux-$GITHUB_RUN_ID" > /tmp/ts.log 2>&1 &
          sleep 20
          LINK=$(grep -o 'https://login.tailscale.com/[^ ]*' /tmp/ts.log | head -1)
          if [ -n "$LINK" ]; then
            echo "=================================================="
            echo "  TAILSCALE LOGIN LINK (5 min mein expire)"
            echo ""
            echo "  $LINK"
            echo ""
            echo "  Phone ke CHROME mein khol, Google se sign in."
            echo "=================================================="
          else
            echo "  [X] link nahi mila"
            cat /tmp/ts.log | head -10
          fi

      - name: '[9e/12] Tailscale IP'
        shell: bash
        run: |
          IP=""
          for i in $(seq 1 12); do
            IP=$(sudo tailscale ip -4 2>/dev/null | grep '^100\.' | head -1)
            [ -n "$IP" ] && break
            sleep 8
          done
          if [ -n "$IP" ]; then
            echo "TS_IP=$IP" >> $GITHUB_ENV
            echo "Tailscale IP: $IP"
          else
            echo "IP nahi mila (login pending?)"
          fi

      # ============================================================
      # 10. BROWSER ACCESS — Cloudflare tunnel
      # ============================================================
      - name: '[10/12] Browser access link'
        if: inputs.browser_access == 'yes'
        shell: bash
        continue-on-error: true
        run: |
          wget -q -O /tmp/cf https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 || \
            curl -sL -o /tmp/cf https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cf
          nohup /tmp/cf tunnel --url http://127.0.0.1:6080 --no-autoupdate > /tmp/cf.log 2>&1 &
          LINK=""
          for i in $(seq 1 20); do
            sleep 4
            LINK=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$LINK" ] && break
          done
          if [ -n "$LINK" ]; then
            echo "CF_LINK=$LINK" >> $GITHUB_ENV
            echo "=================================================="
            echo "  BROWSER ACCESS (koi client nahi chahiye)"
            echo ""
            echo "  $LINK/vnc.html?autoconnect=true&resize=scale"
            echo ""
            echo "  Phone/PC ke browser mein khol -> desktop dikhega"
            echo "=================================================="
          else
            echo "  [X] tunnel nahi bana"
            tail -5 /tmp/cf.log
          fi

      # ============================================================
      # 11. CONNECTION DETAILS
      # ============================================================
      - name: '[11/12] CONNECTION DETAILS'
        shell: bash
        run: |
          PW=$(cat /tmp/PW 2>/dev/null || echo "$PC_PASSWORD")
          echo ""
          echo "=========================================================="
          echo "        WINUX PC TAIYAAR HAI  -  ${{ inputs.hours }} HOURS"
          echo "=========================================================="
          echo ""
          echo "   USER     : runner"
          echo "   PASSWORD : $PW"
          echo ""
          if [ -n "$TS_IP" ]; then
            echo "   ---- TARIKA 1: RDP (Tailscale) ----"
            echo "   ADDRESS  : ${TS_IP}:3389"
            echo "   (Tailscale app ON + RD Client app)"
            echo ""
          fi
          if [ -n "$CF_LINK" ]; then
            echo "   ---- TARIKA 2: BROWSER (koi client nahi) ----"
            echo "   ${CF_LINK}/vnc.html?autoconnect=true&resize=scale"
            echo ""
          fi
          echo "   Theme : ${{ inputs.theme }}   Screen: ${{ inputs.resolution }}"
          echo "=========================================================="
          echo ""

          {
            echo "WINUX CLOUD PC"
            echo "=============="
            echo "TIME     : ${{ inputs.hours }} hours"
            echo "USER     : runner"
            echo "PASSWORD : $PW"
            echo "RDP      : ${TS_IP}:3389"
            echo "BROWSER  : ${CF_LINK}/vnc.html?autoconnect=true&resize=scale"
            echo "THEME    : ${{ inputs.theme }}"
          } > /tmp/CONNECT.txt

      - name: Save connection details
        uses: actions/upload-artifact@v4
        with:
          name: winux-connection
          path: /tmp/CONNECT.txt

      # ============================================================
      # 12. KEEP ALIVE + LIVE COUNTDOWN
      # ============================================================
      - name: '[12/12] Keep PC alive'
        shell: bash
        run: |
          HOURS="${{ inputs.hours }}"
          END=$(( $(date +%s) + HOURS * 3600 ))
          echo "PC chalega $HOURS ghante. Band hoga: $(date -d @$END)"
          N=0
          while [ $(date +%s) -lt $END ]; do
            sleep 60
            N=$((N+1))
            if [ $((N % 5)) -eq 0 ]; then
              LEFT=$(( END - $(date +%s) ))
              LH=$(( LEFT / 3600 )); LM=$(( (LEFT % 3600) / 60 ))
              IP=$(sudo tailscale ip -4 2>/dev/null | grep '^100\.' | head -1)
              PW=$(cat /tmp/PW 2>/dev/null)
              echo "[alive ${LH}h ${LM}m bache] IP: $IP | user: runner | pass: $PW"
            fi
          done
          echo "Time khatam. Band ho raha hai."
          
