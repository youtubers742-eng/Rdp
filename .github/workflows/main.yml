name: Cloud PC

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Kaunsa chahiye'
        required: true
        default: 'linux'
        type: choice
        options:
          - 'linux'
          - 'windows11'
          - 'android'
      hours:
        description: 'Kitne ghante chalega (1-5)'
        required: true
        default: '5'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      screen:
        description: 'Linux screen size'
        required: true
        default: '1366x768'
        type: choice
        options:
          - '1280x720'
          - '1366x768'
          - '1600x900'
          - '1920x1080'
      atype:
        description: 'Android screen - tablet ya phone'
        required: true
        default: 'tablet-1280x800'
        type: choice
        options:
          - 'tablet-1280x800'
          - 'tablet-1600x1000'
          - 'phone-720x1280'
          - 'phone-1080x1920'
      web:
        description: 'Browser me desktop kholo'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      extras:
        description: 'Linux me extra apps (VLC, GIMP, Office, VS Code)'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:

  linux:
    if: inputs.os == 'linux'
    runs-on: ubuntu-latest
    steps:

      - name: '1 Info'
        shell: bash
        run: |
          set +e
          echo "=============================================="
          echo "  CLOUD PC  ->  LINUX DESKTOP"
          echo "  Screen : ${{ inputs.screen }}"
          echo "  Time   : ${{ inputs.hours }} ghante"
          echo "  Web    : ${{ inputs.web }}"
          echo "  Extras : ${{ inputs.extras }}"
          echo "=============================================="
          echo "RES=${{ inputs.screen }}" >> $GITHUB_ENV
          echo "WEB=${{ inputs.web }}" >> $GITHUB_ENV

      - name: '2 Install packages'
        shell: bash
        run: |
          set +e
          sudo apt-get update -y 2>&1 | tail -2
          sudo apt-get install -y xvfb x11vnc novnc websockify xrdp dbus-x11 x11-utils 2>&1 | tail -3
          sudo apt-get install -y xfce4 xfce4-goodies xfce4-terminal thunar thunar-archive-plugin 2>&1 | tail -3
          sudo apt-get install -y arc-theme materia-gtk-theme papirus-icon-theme plank 2>&1 | tail -3
          sudo apt-get install -y fonts-noto fonts-liberation imagemagick xclip curl wget unzip 2>&1 | tail -3
          sudo apt-get install -y -f 2>&1 | tail -2
          for b in Xvfb x11vnc websockify startxfce4 xfconf-query dbus-launch plank; do
            if command -v $b > /dev/null 2>&1; then echo "[OK] $b"; else echo "[WARN] $b nahi mila"; fi
          done

      - name: '3 Browsers'
        shell: bash
        run: |
          set +e
          echo "--- Firefox ---"
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -q --timeout=60 --tries=2 https://packages.mozilla.org/apt/repo-signing-key.gpg -O /tmp/moz.asc
          if [ -s /tmp/moz.asc ]; then
            sudo cp /tmp/moz.asc /etc/apt/keyrings/packages.mozilla.org.asc
            echo 'deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main' > /tmp/moz.list
            sudo cp /tmp/moz.list /etc/apt/sources.list.d/mozilla.list
            printf '%s\n' 'Package: *' 'Pin: origin packages.mozilla.org' 'Pin-Priority: 1000' > /tmp/moz.pin
            sudo cp /tmp/moz.pin /etc/apt/preferences.d/mozilla
            sudo apt-get update -y 2>&1 | tail -2
            sudo apt-get install -y firefox 2>&1 | tail -3
          fi
          if ! command -v firefox > /dev/null 2>&1; then
            echo "[WARN] repo fail - direct download"
            wget -q --timeout=120 --tries=2 -O /tmp/ff.tar.xz 'https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=en-US'
            if [ -s /tmp/ff.tar.xz ]; then
              sudo rm -rf /opt/firefox
              sudo tar -xJf /tmp/ff.tar.xz -C /opt/
              sudo ln -sf /opt/firefox/firefox /usr/local/bin/firefox
              printf '%s\n' \
              '[Desktop Entry]' \
              'Name=Firefox' \
              'Comment=Browse the World Wide Web' \
              'Exec=/opt/firefox/firefox --no-sandbox --disable-dev-shm-usage %u' \
              'Icon=/opt/firefox/browser/chrome/icons/default/default128.png' \
              'Terminal=false' \
              'Type=Application' \
              'Categories=Network;WebBrowser;' > /tmp/ff.desktop
              sudo cp /tmp/ff.desktop /usr/share/applications/firefox.desktop
            fi
          fi
          echo "--- Chrome ---"
          wget -q --timeout=150 --tries=2 -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          if [ -s /tmp/chrome.deb ]; then
            sudo apt-get install -y /tmp/chrome.deb 2>&1 | tail -3
            sudo apt-get install -y -f 2>&1 | tail -2
          fi
          patchde() {
            F="$1"
            if [ ! -f "$F" ]; then echo "[skip] $F"; return 0; fi
            if grep -q -- '--no-sandbox' "$F"; then echo "[OK] already patched"; return 0; fi
            sudo sed -i -E 's#^(Exec=[^ ]+)#\1 --no-sandbox --disable-dev-shm-usage#' "$F" 2>/dev/null
            if grep -q -- '--no-sandbox' "$F"; then echo "[OK] patched $F"; else echo "[WARN] patch fail $F"; fi
          }
          patchde /usr/share/applications/firefox.desktop
          patchde /usr/share/applications/google-chrome.desktop
          command -v firefox > /dev/null 2>&1 && echo "[OK] firefox installed" || echo "[FAIL] firefox nahi mila"
          command -v google-chrome > /dev/null 2>&1 && echo "[OK] chrome installed" || echo "[WARN] chrome nahi mila"

      - name: '4 Extra apps'
        shell: bash
        run: |
          set +e
          if [ "${{ inputs.extras }}" = "yes" ]; then
            sudo apt-get install -y vlc gimp libreoffice-writer libreoffice-calc 2>&1 | tail -3
            sudo apt-get install -y telegram-desktop qbittorrent filezilla 2>&1 | tail -3
            sudo apt-get install -y htop neofetch p7zip-full unrar-free 2>&1 | tail -3
            sudo install -d -m 0755 /etc/apt/keyrings
            wget -q --timeout=60 --tries=2 https://packages.microsoft.com/keys/microsoft.asc -O /tmp/ms.asc
            if [ -s /tmp/ms.asc ]; then
              sudo cp /tmp/ms.asc /etc/apt/keyrings/microsoft.gpg
              echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main' > /tmp/vscode.list
              sudo cp /tmp/vscode.list /etc/apt/sources.list.d/vscode.list
              sudo apt-get update -y 2>&1 | tail -2
              sudo apt-get install -y code 2>&1 | tail -3
            fi
          fi
          mkdir -p ~/Desktop
          for a in firefox google-chrome gimp vlc libreoffice-writer libreoffice-calc code telegramdesktop org.telegram.desktop; do
            if [ -f "/usr/share/applications/$a.desktop" ]; then
              cp "/usr/share/applications/$a.desktop" ~/Desktop/ 2>/dev/null
            fi
          done
          for f in ~/Desktop/*.desktop; do
            if [ -f "$f" ]; then
              gio set "$f" metadata::xfce-exe-checksum "$(sha256sum "$f" | cut -d' ' -f1)" 2>/dev/null
            fi
          done
          ls ~/Desktop/ | sed 's/^/[desktop] /'

      - name: '5 Desktop look'
        shell: bash
        run: |
          set +e
          TH=Adwaita-dark
          for t in Materia-dark-compact Materia-dark Arc-Dark Arc-Darker Adwaita-dark; do
            if [ -d "/usr/share/themes/$t" ]; then TH=$t; break; fi
          done
          IC=Papirus-Dark
          if [ ! -d "/usr/share/icons/$IC" ]; then IC=Adwaita; fi
          echo "[OK] theme = $TH"
          echo "[OK] icons = $IC"
          echo "THEME=$TH" >> $GITHUB_ENV
          echo "ICON=$IC" >> $GITHUB_ENV
          mkdir -p ~/.config/xfce4/xfconf/xfce-perchannel-xml
          printf '%s\n' \
          '<?xml version="1.0" encoding="UTF-8"?>' \
          '<channel name="xsettings" version="1.0">' \
          '  <property name="Net" type="empty">' \
          '    <property name="ThemeName" type="string" value="THEMEVAL"/>' \
          '    <property name="IconThemeName" type="string" value="ICONVAL"/>' \
          '    <property name="EnableEventSounds" type="bool" value="false"/>' \
          '  </property>' \
          '</channel>' | sed -e "s/THEMEVAL/$TH/" -e "s/ICONVAL/$IC/" > ~/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
          printf '%s\n' \
          '<?xml version="1.0" encoding="UTF-8"?>' \
          '<channel name="xfwm4" version="1.0">' \
          '  <property name="general" type="empty">' \
          '    <property name="theme" type="string" value="THEMEVAL"/>' \
          '    <property name="use_compositing" type="bool" value="true"/>' \
          '    <property name="button_layout" type="string" value="O|HMC"/>' \
          '    <property name="title_alignment" type="string" value="center"/>' \
          '  </property>' \
          '</channel>' | sed -e "s/THEMEVAL/$TH/" > ~/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
          W=${RES%x*}; H=${RES#*x}
          if command -v convert > /dev/null 2>&1; then CM=convert; else CM=magick; fi
          $CM -size ${W}x${H} gradient:'#0f2027-#203a43-#2c5364' /tmp/wall-base.png 2>/dev/null
          if [ -f /tmp/wall-base.png ]; then
            sudo mkdir -p /usr/share/backgrounds
            sudo cp /tmp/wall-base.png /usr/share/backgrounds/cloudpc-base.png
            printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<channel name="xfce4-desktop" version="1.0">' \
            '  <property name="backdrop" type="empty">' \
            '    <property name="screen0" type="empty">' \
            '      <property name="monitor0" type="empty">' \
            '        <property name="image-path" type="string" value="/usr/share/backgrounds/cloudpc-base.png"/>' \
            '        <property name="last-image" type="string" value="/usr/share/backgrounds/cloudpc-base.png"/>' \
            '        <property name="image-style" type="int" value="5"/>' \
            '      </property>' \
            '    </property>' \
            '  </property>' \
            '</channel>' > ~/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
            echo "[OK] wallpaper set"
          fi
          mkdir -p ~/.config/autostart ~/.config/plank/dock1/launchers
          printf '%s\n' \
          '[Desktop Entry]' \
          'Name=Plank' \
          'Exec=plank' \
          'Terminal=false' \
          'Type=Application' \
          'X-XFCE-Autostart-Override=true' > ~/.config/autostart/plank.desktop
          for a in firefox google-chrome exo-terminal-emulator thunar gimp vlc libreoffice-writer libreoffice-calc code telegramdesktop org.telegram.desktop; do
            for d in /usr/share/applications /var/lib/snapd/desktop/applications; do
              if [ -f "$d/$a.desktop" ]; then
                printf '%s\n' \
                '[PlankItemsDockItemPreferences]' \
                "Launcher=file://$d/$a.desktop" > ~/.config/plank/dock1/launchers/$a.dockitem
                break
              fi
            done
          done
          ls ~/.config/plank/dock1/launchers/ | sed 's/^/[dock] /'

      - name: '6 Display and network'
        shell: bash
        run: |
          set +e
          W=$(echo "$RES" | cut -d'x' -f1); H=$(echo "$RES" | cut -d'x' -f2)
          PW=$(head -c 12 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 12)
          printf '%s\n' "runner:$PW" > /tmp/pwfile
          sudo chpasswd < /tmp/pwfile
          echo "RDPPW=$PW" >> $GITHUB_ENV
          echo "[OK] password set"
          printf '%s\n' 'startxfce4' > ~/.xsession
          sudo sed -i 's/^allowed_users=.*/allowed_users=anybody/' /etc/xrdp/sesman.ini 2>/dev/null
          sudo service xrdp restart 2>/dev/null || sudo /usr/sbin/xrdp 2>/dev/null || true
          sleep 2
          rm -rf /tmp/.X99-lock
          nohup Xvfb :99 -screen 0 ${W}x${H}x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          sleep 4
          export DISPLAY=:99
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p /tmp/xdg && chmod 700 /tmp/xdg
          if command -v dbus-launch > /dev/null 2>&1; then
            eval "$(dbus-launch --sh-syntax)" 2>/dev/null
            echo "[OK] dbus ready"
          fi
          nohup startxfce4 > /tmp/xfce.log 2>&1 &
          sleep 12
          nohup x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -quiet > /tmp/x11vnc.log 2>&1 &
          sleep 3
          nohup websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 3
          pgrep -x Xvfb > /dev/null && echo "[OK] Xvfb" || echo "[FAIL] Xvfb"
          pgrep -x x11vnc > /dev/null && echo "[OK] x11vnc" || echo "[FAIL] x11vnc"
          XFCE_UP=0
          if pgrep -f startxfce4 > /dev/null || pgrep -x xfce4-session > /dev/null || pgrep -x xfdesktop > /dev/null || pgrep -x xfce4-panel > /dev/null; then XFCE_UP=1; fi
          if [ "$XFCE_UP" = "1" ]; then
            echo "[OK] XFCE chal raha hai"
          else
            nohup startxfce4 > /tmp/xfce2.log 2>&1 &
            sleep 14
            if pgrep -f startxfce4 > /dev/null || pgrep -x xfce4-session > /dev/null || pgrep -x xfdesktop > /dev/null || pgrep -x xfce4-panel > /dev/null; then
              XFCE_UP=1
              echo "[OK] XFCE doosri koshish me chal gaya"
            else
              echo "[FAIL] XFCE nahi chala"
              tail -5 /tmp/xfce.log 2>/dev/null
            fi
          fi
          echo "--- Tailscale ---"
          timeout 180 curl -fsSL --max-time 150 https://tailscale.com/install.sh | sh 2>&1 | tail -2
          K="${{ secrets.TAILSCALE_AUTH_KEY }}"
          IP=""
          if echo "$K" | grep -q '^tskey-auth-'; then
            timeout 120 sudo tailscale up --authkey="$K" --hostname="cloudpc-$GITHUB_RUN_ID" --accept-routes 2>&1 | tail -3
            for i in $(seq 1 12); do
              IP=$(timeout 20 sudo tailscale ip -4 2>/dev/null | grep '^100\.' | head -1)
              if [ -n "$IP" ]; then break; fi
              sleep 8
            done
            if [ -n "$IP" ]; then echo "TS_IP=$IP" >> $GITHUB_ENV; echo "[OK] Tailscale IP = $IP"; else echo "[WARN] Tailscale IP nahi mila"; fi
          else
            echo "[WARN] TAILSCALE_AUTH_KEY galat ya nahi hai - browser link use karo"
          fi
          if [ "$WEB" = "yes" ]; then
            timeout 150 curl -sL --max-time 120 -o /tmp/cf https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x /tmp/cf
            nohup /tmp/cf tunnel --url http://127.0.0.1:6080 --no-autoupdate > /tmp/cf.log 2>&1 &
            LINK=""
            for i in $(seq 1 20); do
              sleep 4
              LINK=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1)
              if [ -n "$LINK" ]; then break; fi
            done
            if [ -n "$LINK" ]; then echo "CF_LINK=$LINK" >> $GITHUB_ENV; echo "[OK] browser link mil gaya"; else echo "[WARN] tunnel nahi bana"; fi
          fi

      - name: '7 Health check'
        shell: bash
        run: |
          set +e
          export DISPLAY=:99
          echo "=============================================="
          echo "  HEALTH CHECK"
          echo "=============================================="
          chk() {
            if [ "$1" = "0" ]; then echo "[OK] $2"; else echo "[FAIL] $2"; fi
          }
          pgrep -x Xvfb > /dev/null; chk $? "Xvfb display"
          pgrep -x x11vnc > /dev/null; chk $? "x11vnc :5900"
          pgrep -f websockify > /dev/null; chk $? "websockify :6080"
          pgrep -x xfce4-session > /dev/null || pgrep -x xfdesktop > /dev/null; chk $? "XFCE desktop"
          command -v firefox > /dev/null 2>&1; chk $? "Firefox"
          command -v google-chrome > /dev/null 2>&1; chk $? "Chrome"
          [ -d "/usr/share/themes/${THEME:-Adwaita-dark}" ]; chk $? "Theme ${THEME:-Adwaita-dark}"
          [ -d "/usr/share/icons/${ICON:-Adwaita}" ]; chk $? "Icons ${ICON:-Adwaita}"
          W=${RES%x*}; H=${RES#*x}
          if command -v convert > /dev/null 2>&1; then CM=convert; else CM=magick; fi
          IPX=${TS_IP:-not-set}
          PWX=${RDPPW:-not-set}
          LX=${CF_LINK:-not-set}
          $CM -size ${W}x${H} gradient:'#0f2027-#203a43-#2c5364' \
            -gravity North -fill '#00d4ff' -pointsize 48 -annotate +0+70 'CLOUD PC' \
            -fill '#ffffff' -pointsize 26 -annotate +0+140 'Linux Desktop | XFCE' \
            -fill '#9fe6ff' -pointsize 22 -annotate +0+230 "RDP  $IPX:3389" \
            -fill '#ffffff' -pointsize 22 -annotate +0+270 'USER  runner' \
            -fill '#ffffff' -pointsize 22 -annotate +0+310 "PASS  $PWX" \
            -fill '#7CFFB2' -pointsize 20 -annotate +0+390 "WEB  $LX" \
            -fill '#888888' -pointsize 18 -annotate +0+460 'Firefox + Chrome ready' \
            /tmp/cloudpc-info.png 2>/dev/null
          if [ -f /tmp/cloudpc-info.png ]; then
            sudo mkdir -p /usr/share/backgrounds
            sudo cp /tmp/cloudpc-info.png /usr/share/backgrounds/cloudpc-info.png
            timeout 10 xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/image-path -s /usr/share/backgrounds/cloudpc-info.png 2>/dev/null
            timeout 10 xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/last-image -s /usr/share/backgrounds/cloudpc-info.png 2>/dev/null
            echo "[OK] desktop pe info likh diya"
          fi
          timeout 10 xfconf-query -c xsettings -p /Net/ThemeName -s "${THEME:-Adwaita-dark}" 2>/dev/null
          timeout 10 xfconf-query -c xsettings -p /Net/IconThemeName -s "${ICON:-Adwaita}" 2>/dev/null
          timeout 10 xfconf-query -c xfwm4 -p /general/theme -s "${THEME:-Adwaita-dark}" 2>/dev/null
          timeout 10 xfce4-panel -r 2>/dev/null
          echo "=============================================="
          echo "  LINUX PC TAIYAR HAI"
          echo "=============================================="
          if [ -n "$TS_IP" ]; then
            echo "  RDP  : $TS_IP:3389"
            echo "  USER : runner"
            echo "  PASS : $RDPPW"
          else
            echo "  RDP  : Tailscale key nahi hai, browser use karo"
          fi
          if [ -n "$CF_LINK" ]; then
            echo "  WEB  : $CF_LINK/vnc.html?autoconnect=true&resize=scale"
          fi
          echo "  TIME : ${{ inputs.hours }} ghante"
          echo "=============================================="

      - name: '8 Keep alive'
        shell: bash
        run: |
          set +e
          H=${{ inputs.hours }}
          T=$((H*3600)); S=300
          echo "[OK] $H ghante chalega"
          while [ $T -gt 0 ]; do
            if [ $T -lt $S ]; then S=$T; fi
            sleep $S
            T=$((T-S))
            echo "[alive] bache $((T/60)) min  |  $(date +%H:%M:%S)"
          done
          echo "TIME OVER"

  android:
    if: inputs.os == 'android'
    runs-on: ubuntu-latest
    steps:

      - name: '1 Info'
        shell: bash
        run: |
          set +e
          A="${{ inputs.atype }}"
          KIND=$(echo "$A" | cut -d- -f1)
          SZ=$(echo "$A" | cut -d- -f2)
          AW=$(echo "$SZ" | cut -dx -f1)
          AH=$(echo "$SZ" | cut -dx -f2)
          if [ "$KIND" = "tablet" ]; then ADPI=200; else ADPI=320; fi
          echo "=============================================="
          echo "  CLOUD PC  ->  ANDROID"
          echo "  Type  : $KIND"
          echo "  Size  : ${AW}x${AH}  dpi $ADPI"
          echo "  Time  : ${{ inputs.hours }} ghante"
          echo "  Web   : ${{ inputs.web }}"
          echo "     ADB address : $TS_IP:5555"
          echo "=============================================="

      - name: '7 Keep alive'
        shell: bash
        run: |
          set +e
          H=${{ inputs.hours }}
          T=$((H*3600)); S=300
          echo "[OK] $H ghante chalega"
          while [ $T -gt 0 ]; do
            if [ $T -lt $S ]; then S=$T; fi
            sleep $S
            T=$((T-S))
            echo "[alive] bache $((T/60)) min  |  $(date +%H:%M:%S)"
            pgrep -x scrcpy > /dev/null || echo "[warn] scrcpy dead"
          done
          echo "TIME OVER"

  windows:
    if: inputs.os == 'windows11'
    runs-on: windows-latest
    steps:

      - name: '1 User and password'
        shell: pwsh
        run: |
          $p = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 14 | ForEach-Object { [char]$_ })
          net user RDP "$p" /add /y
          net localgroup administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add
          Add-Content -Path $env:GITHUB_ENV -Value "RDPPW=$p"
          Write-Output "[OK] user RDP ban gaya"

      - name: '2 Enable RDP'
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          netsh advfirewall firewall add rule name='RDP3389' dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
          Write-Output "[OK] RDP on ho gaya"

      - name: '3 Tailscale'
        shell: pwsh
        run: |
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msi -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList '/i', $msi, '/quiet', '/norestart' -Wait
          Start-Sleep -Seconds 5
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $k = '${{ secrets.TAILSCALE_AUTH_KEY }}'
          if ($k -like 'tskey-auth-*') {
            $o = "$env:TEMP\ts_out.txt"
            $e = "$env:TEMP\ts_err.txt"
            $a = @('up', "--authkey=$k", "--hostname=winpc-$env:GITHUB_RUN_ID", '--accept-routes')
            Start-Process -FilePath $ts -ArgumentList $a -RedirectStandardOutput $o -RedirectStandardError $e -NoNewWindow -Wait
            Get-Content $o, $e -ErrorAction SilentlyContinue | Select-Object -Last 5
            $ip = ''
            for ($i = 0; $i -lt 12; $i++) {
              $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
              if ($ip) { break }
              Start-Sleep -Seconds 10
            }
            if ($ip) {
              Add-Content -Path $env:GITHUB_ENV -Value "TS_IP=$ip"
              Write-Output "[OK] Tailscale IP = $ip"
            } else {
              Write-Output "[WARN] Tailscale IP nahi mila"
            }
          } else {
            Write-Output "[WARN] TAILSCALE_AUTH_KEY galat ya nahi hai"
          }

      - name: '4 Health check'
        shell: pwsh
        run: |
          Write-Output "=============================================="
          Write-Output "  WINDOWS 11 PC TAIYAR HAI"
          Write-Output "=============================================="
          if ($env:TS_IP) {
            Write-Output "  RDP  : $env:TS_IP:3389"
          } else {
            Write-Output "  RDP  : Tailscale key nahi hai"
          }
          Write-Output "  USER : RDP"
          Write-Output "  PASS : $env:RDPPW"
          Write-Output "  TIME : ${{ inputs.hours }} ghante"
          Write-Output "=============================================="
          $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue
          if ($svc) { Write-Output "[OK] TermService = $($svc.Status)" }
          $u = Get-LocalUser -Name RDP -ErrorAction SilentlyContinue
          if ($u) { Write-Output "[OK] user RDP maujood hai" }

      - name: '5 Keep alive'
        shell: pwsh
        run: |
          $h = [int]'${{ inputs.hours }}'
          $end = (Get-Date).AddHours($h)
          Write-Output "[OK] $h ghante chalega"
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 300
            $left = $end - (Get-Date)
            Write-Output "[alive] bache $([math]::Round($left.TotalMinutes)) min  |  $(Get-Date -Format 'HH:mm:ss')"
          }
          Write-Output "TIME OVER"
        
    
    
