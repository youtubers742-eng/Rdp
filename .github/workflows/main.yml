name: Windows VNC

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Kitne ghante chalana hai (1-6)"
        required: true
        default: "5"
        type: choice
        options: ["1", "2", "3", "4", "5", "6"]

jobs:
  pc:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 1 - TightVNC Install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $vncPass = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 8 | ForEach-Object { [char]$_ })
          "VNC_PASS=$vncPass" | Out-File -FilePath $env:GITHUB_ENV -Append

          $props = "SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=$vncPass SET_ALLOWLOOPBACK=1 VALUE_OF_ALLOWLOOPBACK=1 SET_LOOPBACKONLY=1 VALUE_OF_LOOPBACKONLY=1 SET_ACCEPTHTTPCONNECTIONS=1 VALUE_OF_ACCEPTHTTPCONNECTIONS=0"
          choco install tightvnc -y --no-progress --install-arguments="$props"
          Start-Sleep -Seconds 5

          $svc = Get-Service tvnserver -ErrorAction SilentlyContinue
          if (-not $svc) { Write-Host "[ERROR] TightVNC service nahi mili, install fail hua"; exit 1 }

          $reg = "HKLM:\SOFTWARE\TightVNC\Server"
          if (Test-Path $reg) {
            Set-ItemProperty -Path $reg -Name AllowLoopback -Value 1 -Type DWord
            Set-ItemProperty -Path $reg -Name LoopbackOnly -Value 1 -Type DWord
          }
          Restart-Service tvnserver -Force

          $ok = $false
          for ($i = 0; $i -lt 15 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try {
              $c = New-Object Net.Sockets.TcpClient
              $c.Connect("127.0.0.1", 5900)
              $s = $c.GetStream()
              $s.ReadTimeout = 4000
              $b = New-Object byte[] 12
              $n = $s.Read($b, 0, 12)
              $banner = [Text.Encoding]::ASCII.GetString($b, 0, $n)
              $hello = [Text.Encoding]::ASCII.GetBytes("RFB 003.008" + [char]10)
              $s.Write($hello, 0, $hello.Length)
              $t = New-Object byte[] 1
              $null = $s.Read($t, 0, 1)
              $c.Close()
              if ($banner.StartsWith("RFB") -and $t[0] -gt 0) { $ok = $true }
            } catch { }
          }
          if ($ok) { Write-Host "[OK] VNC server chal raha hai aur connection accept kar raha hai" }
          else { Write-Host "[ERROR] VNC server connection accept nahi kar raha"; exit 1 }

      - name: 2 - noVNC + websockify + Caddy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          function Test-Ws($uri) {
            for ($k = 0; $k -lt 3; $k++) {
              try {
                $ws = New-Object System.Net.WebSockets.ClientWebSocket
                $ws.Options.AddSubProtocol("binary")
                $cts = New-Object System.Threading.CancellationTokenSource 10000
                $ws.ConnectAsync([Uri]$uri, $cts.Token).GetAwaiter().GetResult()
                $buf = New-Object byte[] 64
                $res = $ws.ReceiveAsync([ArraySegment[byte]]::new($buf), $cts.Token).GetAwaiter().GetResult()
                $txt = [Text.Encoding]::ASCII.GetString($buf, 0, $res.Count)
                $ws.Dispose()
                if ($txt.StartsWith("RFB")) { return $true }
              } catch { }
              Start-Sleep -Seconds 2
            }
            return $false
          }

          # noVNC files
          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip" -OutFile "$env:RUNNER_TEMP\novnc.zip"
          Expand-Archive "$env:RUNNER_TEMP\novnc.zip" -DestinationPath "C:\" -Force
          if (-not (Test-Path "C:\noVNC-1.5.0\vnc.html")) { Write-Host "[ERROR] noVNC files nahi mile"; exit 1 }

          # websockify (sirf websocket ke liye, files serve nahi karega)
          python -m pip install --quiet websockify
          Start-Process -FilePath "python" -ArgumentList "-m", "websockify", "127.0.0.1:6080", "127.0.0.1:5900" -WindowStyle Hidden -RedirectStandardOutput "C:\websockify.log" -RedirectStandardError "C:\websockify.err.log"

          # Caddy (files tez serve karta hai + /websockify ko proxy karta hai)
          Invoke-WebRequest -Uri "https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_windows_amd64.zip" -OutFile "$env:RUNNER_TEMP\caddy.zip"
          Expand-Archive "$env:RUNNER_TEMP\caddy.zip" -DestinationPath "C:\caddy" -Force
          if (-not (Test-Path "C:\caddy\caddy.exe")) { Write-Host "[ERROR] caddy.exe nahi mila"; exit 1 }

          $caddyfile = @(
            "{",
            "  admin off",
            "  auto_https off",
            "}",
            ":8080 {",
            "  handle /websockify* {",
            "    reverse_proxy 127.0.0.1:6080",
            "  }",
            "  handle {",
            "    root * C:/noVNC-1.5.0",
            "    encode gzip",
            "    @js path *.js *.mjs",
            "    @css path *.css",
            "    header @js Content-Type text/javascript",
            "    header @css Content-Type text/css",
            "    file_server",
            "  }",
            "}"
          )
          Set-Content -Path "C:\Caddyfile" -Value $caddyfile
          Start-Process -FilePath "C:\caddy\caddy.exe" -ArgumentList "run", "--config", "C:\Caddyfile", "--adapter", "caddyfile" -WindowStyle Hidden -RedirectStandardOutput "C:\caddy.out.log" -RedirectStandardError "C:\caddy.err.log"

          $ok = $false
          for ($i = 0; $i -lt 15 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8080/vnc.html" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true }
            } catch { }
          }
          if (-not $ok) {
            Write-Host "[ERROR] noVNC page nahi khula. Caddy log:"
            if (Test-Path "C:\caddy.err.log") { Get-Content "C:\caddy.err.log" -Tail 30 | Out-Host }
            exit 1
          }
          Write-Host "[OK] noVNC page local pe khul gaya"

          try {
            $js = Invoke-WebRequest "http://127.0.0.1:8080/core/rfb.js" -UseBasicParsing -TimeoutSec 10
            Write-Host "[INFO] rfb.js content-type: $($js.Headers['Content-Type'] -join ',')"
          } catch { Write-Host "[WARN] rfb.js nahi khula" }

          if (Test-Ws "ws://127.0.0.1:8080/websockify") {
            Write-Host "[OK] noVNC -> websocket -> VNC poori chain chal rahi hai"
          } else {
            Write-Host "[WARN] websocket chain fail hui. Logs:"
            if (Test-Path "C:\websockify.err.log") { Get-Content "C:\websockify.err.log" -Tail 20 | Out-Host }
            if (Test-Path "C:\caddy.err.log") { Get-Content "C:\caddy.err.log" -Tail 20 | Out-Host }
          }

      - name: 3 - Tunnels (Cloudflare + localhost.run)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe"

          function Test-Ws($uri) {
            for ($k = 0; $k -lt 3; $k++) {
              try {
                $ws = New-Object System.Net.WebSockets.ClientWebSocket
                $ws.Options.AddSubProtocol("binary")
                $cts = New-Object System.Threading.CancellationTokenSource 10000
                $ws.ConnectAsync([Uri]$uri, $cts.Token).GetAwaiter().GetResult()
                $buf = New-Object byte[] 64
                $res = $ws.ReceiveAsync([ArraySegment[byte]]::new($buf), $cts.Token).GetAwaiter().GetResult()
                $txt = [Text.Encoding]::ASCII.GetString($buf, 0, $res.Count)
                $ws.Dispose()
                if ($txt.StartsWith("RFB")) { return $true }
              } catch { }
              Start-Sleep -Seconds 2
            }
            return $false
          }

          function Test-Live($u) {
            for ($j = 0; $j -lt 15; $j++) {
              Start-Sleep -Seconds 3
              try {
                $r = Invoke-WebRequest "$u/vnc.html" -UseBasicParsing -TimeoutSec 10
                if ($r.StatusCode -eq 200) { return $true }
              } catch { }
            }
            return $false
          }

          function Start-Cf($proto) {
            Remove-Item "C:\cf.log" -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList "tunnel", "--no-autoupdate", "--protocol", $proto, "--url", "http://127.0.0.1:8080" -WindowStyle Hidden -PassThru -RedirectStandardOutput "C:\cf.out.log" -RedirectStandardError "C:\cf.log"
            $url = $null
            $reg = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path "C:\cf.log") {
                if (-not $url) {
                  $m = Select-String -Path "C:\cf.log" -Pattern "https://(?!api\.)[a-z0-9-]+\.trycloudflare\.com" -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($m) { $url = $m.Matches[0].Value }
                }
                if (-not $reg) {
                  if (Select-String -Path "C:\cf.log" -Pattern "Registered tunnel connection" -Quiet -ErrorAction SilentlyContinue) { $reg = $true }
                }
              }
              if ($url -and $reg) { break }
            }
            if ($url -and $reg) {
              if (Test-Live $url) { return $url }
            }
            Write-Host "[WARN] Cloudflare ($proto) fail hua. log:"
            if (Test-Path "C:\cf.log") { Get-Content "C:\cf.log" -Tail 8 | Out-Host }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            return $null
          }

          function Start-Lhr {
            Remove-Item "C:\lhr.out.log", "C:\lhr.err.log" -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath "ssh" -ArgumentList "-o", "StrictHostKeyChecking=no", "-o", "UserKnownHostsFile=NUL", "-o", "ServerAliveInterval=30", "-o", "ExitOnForwardFailure=yes", "-R", "80:127.0.0.1:8080", "nokey@localhost.run" -WindowStyle Hidden -PassThru -RedirectStandardOutput "C:\lhr.out.log" -RedirectStandardError "C:\lhr.err.log"
            $url = $null
            for ($i = 0; $i -lt 20 -and -not $url; $i++) {
              Start-Sleep -Seconds 2
              foreach ($f in @("C:\lhr.out.log", "C:\lhr.err.log")) {
                if (-not $url -and (Test-Path $f)) {
                  $m = Select-String -Path $f -Pattern "https://[a-z0-9]+\.lhr\.life" -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($m) { $url = $m.Matches[0].Value }
                }
              }
            }
            if ($url) { return $url }
            Write-Host "[WARN] localhost.run link nahi mila"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            return $null
          }

          $cf = $null
          foreach ($proto in @("http2", "quic", "http2")) {
            if (-not $cf) { $cf = Start-Cf $proto }
          }
          $lhr = Start-Lhr
          if ($lhr) { Write-Host "[INFO] localhost.run page live: $(Test-Live $lhr)" }

          if (-not $cf -and -not $lhr) { Write-Host "[ERROR] Koi bhi tunnel nahi bana"; exit 1 }

          $pw = $env:VNC_PASS
          if ($cf) {
            $w = Test-Ws (($cf -replace '^https', 'wss') + "/websockify")
            Write-Host "[INFO] Cloudflare websocket chal raha hai: $w"
            $l = "$cf/vnc.html?autoconnect=true&resize=scale&password=$pw"
            "CF_LINK=$l" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "[OK] CLOUDFLARE LINK: $l"
          }
          if ($lhr) {
            $w = Test-Ws (($lhr -replace '^https', 'wss') + "/websockify")
            Write-Host "[INFO] localhost.run websocket chal raha hai: $w"
            $l = "$lhr/vnc.html?autoconnect=true&resize=scale&password=$pw"
            "LHR_LINK=$l" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "[OK] LOCALHOST.RUN LINK: $l"
          }

      - name: 4 - Connect Info
        if: always()
        shell: pwsh
        run: |
          $lines = @("## Windows VNC", "")
          if ($env:CF_LINK -or $env:LHR_LINK) {
            $lines += "VNC Password: ``$($env:VNC_PASS)`` (links me already laga hai)"
            $lines += ""
            if ($env:CF_LINK) { $lines += "**Link 1 (Cloudflare):**"; $lines += ""; $lines += $env:CF_LINK; $lines += "" }
            if ($env:LHR_LINK) { $lines += "**Link 2 (localhost.run):**"; $lines += ""; $lines += $env:LHR_LINK; $lines += "" }
            $lines += "Ek link na khule to doosra try karo."
          } else {
            $lines += "Link nahi bana. Upar ke steps me [ERROR] line dekho."
          }
          $text = $lines -join "`n"
          $text | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host $text

      - name: 5 - PC Zinda Rakho
        if: env.CF_LINK != '' || env.LHR_LINK != ''
        shell: pwsh
        run: |
          function Test-Port($port) {
            try { $c = New-Object Net.Sockets.TcpClient; $c.Connect("127.0.0.1", $port); $c.Close(); return $true } catch { return $false }
          }
          function Find-Url($file, $pattern) {
            if (Test-Path $file) {
              $m = Select-String -Path $file -Pattern $pattern -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($m) { return $m.Matches[0].Value }
            }
            return $null
          }
          $end = (Get-Date).AddMinutes([int]"${{ inputs.hours }}" * 60)
          $n = 0
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
            $n++

            if ((Get-Service tvnserver).Status -ne 'Running') { Start-Service tvnserver }

            if (-not (Test-Port 6080)) {
              Write-Host "[WARN] websockify band tha, dobara chala raha hu"
              Start-Process -FilePath "python" -ArgumentList "-m", "websockify", "127.0.0.1:6080", "127.0.0.1:5900" -WindowStyle Hidden
            }
            if (-not (Test-Port 8080)) {
              Write-Host "[WARN] Caddy band tha, dobara chala raha hu"
              Start-Process -FilePath "C:\caddy\caddy.exe" -ArgumentList "run", "--config", "C:\Caddyfile", "--adapter", "caddyfile" -WindowStyle Hidden
            }

            if ($env:CF_LINK -and -not (Get-Process cloudflared -ErrorAction SilentlyContinue)) {
              Write-Host "[WARN] cloudflared band ho gaya, restart"
              Remove-Item "C:\cf.log" -ErrorAction SilentlyContinue
              Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList "tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://127.0.0.1:8080" -WindowStyle Hidden -RedirectStandardOutput "C:\cf.out.log" -RedirectStandardError "C:\cf.log"
              Start-Sleep -Seconds 25
              $u = Find-Url "C:\cf.log" "https://(?!api\.)[a-z0-9-]+\.trycloudflare\.com"
              if ($u) { Write-Host "[NAYA CLOUDFLARE LINK] $u/vnc.html?autoconnect=true&resize=scale&password=$($env:VNC_PASS)" }
            }

            if ($env:LHR_LINK -and -not (Get-Process ssh -ErrorAction SilentlyContinue)) {
              Write-Host "[WARN] localhost.run band ho gaya, restart"
              Remove-Item "C:\lhr.out.log", "C:\lhr.err.log" -ErrorAction SilentlyContinue
              Start-Process -FilePath "ssh" -ArgumentList "-o", "StrictHostKeyChecking=no", "-o", "UserKnownHostsFile=NUL", "-o", "ServerAliveInterval=30", "-R", "80:127.0.0.1:8080", "nokey@localhost.run" -WindowStyle Hidden -RedirectStandardOutput "C:\lhr.out.log" -RedirectStandardError "C:\lhr.err.log"
              Start-Sleep -Seconds 15
              $u = Find-Url "C:\lhr.out.log" "https://[a-z0-9]+\.lhr\.life"
              if (-not $u) { $u = Find-Url "C:\lhr.err.log" "https://[a-z0-9]+\.lhr\.life" }
              if ($u) { Write-Host "[NAYA LOCALHOST.RUN LINK] $u/vnc.html?autoconnect=true&resize=scale&password=$($env:VNC_PASS)" }
            }

            Write-Host "PC chal raha hai... $n minute"
            if ($n % 10 -eq 0) {
              if ($env:CF_LINK) { Write-Host "LINK 1: $env:CF_LINK" }
              if ($env:LHR_LINK) { Write-Host "LINK 2: $env:LHR_LINK" }
            }
          }
          Write-Host "Time khatam. PC band ho raha hai."
