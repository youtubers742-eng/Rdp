# ============================================================
#  Free Windows Cloud PC — GitHub Actions + Tailscale
#  OS      : Windows Server 2022 (GitHub-hosted runner)
#  RAM     : 16 GB (public repository)
#  Session : up to 6 hours (GitHub limit)
#  Auth    : key  = reusable Tailscale auth key (secret)
#            link = interactive Tailscale login URL in log
#  Extra   : OmniRush auto download + silent install
# ============================================================
name: Free Windows PC

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: 'key = use TAILSCALE_AUTH_KEY secret, link = interactive login URL'
        required: true
        default: 'key'
        type: choice
        options:
          - key
          - link
      rdp_password:
        description: 'RDP password (leave blank for auto generated)'
        required: false
        default: ''
      install_omnirush:
        description: 'Download and install OmniRush automatically'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:
      # ----------------------------------------------------
      # 1. Enable Remote Desktop (NLA on)
      # ----------------------------------------------------
      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "Remote Desktop enabled."

      # ----------------------------------------------------
      # 2. Create RDP user + strong password
      # ----------------------------------------------------
      - name: Create RDP user
        shell: pwsh
        run: |
          $p = "${{ inputs.rdp_password }}"
          if ([string]::IsNullOrWhiteSpace($p) -or $p.Length -lt 8) {
            $U = 'ABCDEFGHJKLMNPQRSTUVWXYZ'.ToCharArray()
            $L = 'abcdefghijkmnpqrstuvwxyz'.ToCharArray()
            $N = '23456789'.ToCharArray()
            $S = '@#%&*!'.ToCharArray()
            $A = $U + $L + $N + $S
            $parts = @()
            $parts += ($U | Get-Random)
            $parts += ($L | Get-Random)
            $parts += ($N | Get-Random)
            $parts += ($S | Get-Random)
            $parts += (1..10 | ForEach-Object { $A | Get-Random })
            $p = -join ($parts | Sort-Object { Get-Random })
          }
          if ([string]::IsNullOrWhiteSpace($p) -or $p.Length -lt 8) { $p = 'Cloud@PC2026x' }
          $secure = ConvertTo-SecureString $p -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "RDP" -Password $secure
          } else {
            New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          "RDP_PASS=$p" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "RDP user ready."

      # ----------------------------------------------------
      # 3. Install Tailscale
      # ----------------------------------------------------
      - name: Install Tailscale
        shell: pwsh
        run: |
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i", $msi, "/quiet", "/norestart" -Wait
          Remove-Item $msi -Force
          Write-Host "Tailscale installed."

      # ----------------------------------------------------
      # 4. Connect Tailscale
      # ----------------------------------------------------
      - name: Connect Tailscale
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $mode = "${{ inputs.auth_mode }}"
          $pcName = "gh-pc-$env:GITHUB_RUN_ID"
          $authKey = "${{ secrets.TAILSCALE_AUTH_KEY }}"

          if ($mode -eq "link") {
            $out = "$env:TEMP\ts.out"
            $err = "$env:TEMP\ts.err"
            Remove-Item $out, $err -ErrorAction SilentlyContinue
            Start-Process -FilePath $ts -ArgumentList "up", "--hostname=$pcName" -RedirectStandardOutput $out -RedirectStandardError $err -WindowStyle Hidden
            Start-Sleep -Seconds 20
            $log = @()
            if (Test-Path $out) { $log += Get-Content $out }
            if (Test-Path $err) { $log += Get-Content $err }
            $log | ForEach-Object { Write-Host $_ }
            $m = $log | Select-String -Pattern 'https://login\.tailscale\.com/\S+' | Select-Object -First 1
            if ($m) {
              Write-Host "=========================================="
              Write-Host "  TAILSCALE LOGIN LINK"
              Write-Host "  $($m.Matches[0].Value)"
              Write-Host "  Open this link and sign in."
              Write-Host "=========================================="
            }
          } else {
            & $ts "up" "--authkey=$authKey" "--hostname=$pcName"
          }

          $ip = $null
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 15
            $ip = & $ts "ip" "-4" 2>$null | Select-String -Pattern '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | Select-Object -First 1
            if ($ip) { break }
          }
          if ($ip) {
            Write-Host "Tailscale connected. IP: $ip"
          } else {
            Write-Host "No Tailscale IP yet."
            Write-Host "key mode: auth key is invalid, expired or single use."
            Write-Host "Fix: generate a NEW key with Reusable enabled and update the secret."
            Write-Host "Or: re-run this workflow with auth_mode = link."
          }

      # ----------------------------------------------------
      # 5. OmniRush download + silent install
      # ----------------------------------------------------
      - name: Install OmniRush
        shell: pwsh
        continue-on-error: true
        run: |
          if ("${{ inputs.install_omnirush }}" -ne "yes") { Write-Host "Skipped."; exit 0 }
          $url = "https://github.com/omnirush-ai/omnirush-gui/releases/latest/download/omnirush-win-x64-2.2.17.exe"
          $exe = "$env:USERPROFILE\Desktop\OmniRush.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          Write-Host "OmniRush downloaded to Desktop."
          Start-Process -FilePath $exe -ArgumentList "/S" -Wait
          Write-Host "OmniRush installed."
          $target = "$env:LOCALAPPDATA\Programs\omnirush\OmniRush.exe"
          if (-not (Test-Path $target)) {
            $found = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter "OmniRush.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $target = $found.FullName }
          }
          if (Test-Path $target) {
            $w = New-Object -ComObject WScript.Shell
            $s = $w.CreateShortcut("$env:USERPROFILE\Desktop\OmniRush.lnk")
            $s.TargetPath = $target
            $s.Save()
            Write-Host "OmniRush desktop shortcut created."
          }

      # ----------------------------------------------------
      # 6. Keep alive + print connection info
      # ----------------------------------------------------
      - name: Keep PC alive
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $pass = $env:RDP_PASS
          $end = (Get-Date).AddMinutes(348)
          Write-Host "=========================================="
          Write-Host "  WINDOWS CLOUD PC READY"
          Write-Host "=========================================="
          while ((Get-Date) -lt $end) {
            $ip = & $ts "ip" "-4" 2>$null | Select-String -Pattern '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | Select-Object -First 1
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ADDRESS: $ip | USER: RDP | PASSWORD: $pass"
            Start-Sleep -Seconds 30
          }
          Write-Host "Session finished. Run the workflow again for a new PC."
