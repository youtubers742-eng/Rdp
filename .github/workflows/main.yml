name: Free Windows PC
on:
  workflow_dispatch:
jobs:
  cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create user
        shell: pwsh
        run: |
          $chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789@#%&'
          $p=-join (1..14 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          $s=ConvertTo-SecureString $p -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) { Set-LocalUser -Name "RDP" -Password $s }
          else { New-LocalUser -Name "RDP" -Password $s -AccountNeverExpires | Out-Null }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          "RDP_PASS=$p" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Tailscale
        shell: pwsh
        run: |
          $m="$env:TEMP\ts.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $m
          Start-Process msiexec.exe -ArgumentList "/i",$m,"/quiet","/norestart" -Wait
          Remove-Item $m -Force

      - name: LOGIN LINK YAHAN
        shell: pwsh
        run: |
          $ts="$env:ProgramFiles\Tailscale\tailscale.exe"
          $o="$env:TEMP\o.txt"; $e="$env:TEMP\e.txt"
          Remove-Item $o,$e -ErrorAction SilentlyContinue
          Start-Process -FilePath $ts -ArgumentList "up","--hostname=gh-pc-$env:GITHUB_RUN_ID" -RedirectStandardOutput $o -RedirectStandardError $e -WindowStyle Hidden
          Start-Sleep -Seconds 18
          $log=@(); if(Test-Path $o){$log+=Get-Content $o}; if(Test-Path $e){$log+=Get-Content $e}
          $log | ForEach-Object { Write-Host $_ }
          $m2=$log | Select-String 'https://login\.tailscale\.com/\S+' | Select-Object -First 1
          if($m2){ Write-Host "###### LOGIN LINK: $($m2.Matches[0].Value) ######" }
          for($i=0;$i -lt 20;$i++){ Start-Sleep -Seconds 15; $ip=& $ts ip -4 2>$null | Select-String '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | Select-Object -First 1; if($ip){ Write-Host "READY IP: $ip"; break } }

      - name: OmniRush auto download
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest "https://github.com/omnirush-ai/omnirush-gui/releases/latest/download/omnirush-win-x64-2.2.17.exe" -OutFile "$env:USERPROFILE\Desktop\OmniRush.exe"
          Write-Host "OmniRush Desktop par ready hai"

      - name: KEEP ALIVE - IP YAHAN
        shell: pwsh
        run: |
          $ts="$env:ProgramFiles\Tailscale\tailscale.exe"
          $end=(Get-Date).AddMinutes(348)
          while((Get-Date) -lt $end){
            $ip=& $ts ip -4 2>$null | Select-String '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | Select-Object -First 1
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ADDRESS: $ip | USER: RDP | PASSWORD: $env:RDP_PASS"
            Start-Sleep -Seconds 30
          }
