# ============================================================
#  OMNIRUSH PC — WINDOWS + LINUX (ek hi file, jab chaho switch)
# ============================================================
#  SABSE UPAR "os" choose karo:  windows  ya  linux
#  Baaki sab options waise hi hain (time, OmniRush, Tailscale)
#
#  WINDOWS  = asli desktop PC (RDP se phone se chalao) + OmniRush GUI
#  LINUX    = fast CLI agent + browser mein Linux desktop (noVNC)
#
#  SECRETS:
#    TAILSCALE_AUTH_KEY  tskey-auth-... (Reusable ON) — sirf Tailscale ke liye
#    OMNIRUSH_AUTH       login ke baad milta hai (dobara login na pade)
# ============================================================
name: OmniRush PC

on:
  workflow_dispatch:
    inputs:
      os:
        description: '⭐ Kaunsa OS chahiye?'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - linux
      mode:
        description: 'task = kaam karwao | login = pehli baar | pc = desktop chalu rakho'
        required: true
        default: 'task'
        type: choice
        options:
          - task
          - login
          - pc
      hours:
        description: 'Kitni der chalu rakhe?'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      install_omnirush:
        description: 'OmniRush install karu?'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      tailscale:
        description: 'Tailscale ON karu? (Windows RDP / Linux desktop ke liye)'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      task:
        description: 'Kya karana hai? (task mode mein)'
        required: false
        default: 'ek simple calculator app bana ke do'

jobs:
  pc:
    runs-on: ${{ inputs.os == 'linux' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 355

    steps:
      # ============================================================
      #  COMMON
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Banner
        shell: bash
        run: |
          echo "=================================================="
          echo "  OMNIRUSH PC"
          echo "  OS   : ${{ inputs.os }}"
          echo "  MODE : ${{ inputs.mode }}"
          echo "  TIME : ${{ inputs.hours }} ghante"
          echo "=================================================="

      # ============================================================
      #  ###################  L I N U X  ###################
      # ============================================================
      - name: "[Linux] Session restore"
        if: inputs.os == 'linux'
        shell: bash
        env:
          OMNIRUSH_AUTH: ${{ secrets.OMNIRUSH_AUTH }}
        run: |
          mkdir -p "$HOME/.omnirush"
          if [ -n "$OMNIRUSH_AUTH" ]; then
            echo "$OMNIRUSH_AUTH" | base64 -d > "$HOME/.omnirush/auth.json" 2>/dev/null || true
            [ -s "$HOME/.omnirush/auth.json" ] && echo "[OK] Purani session mili." || rm -f "$HOME/.omnirush/auth.json"
          else
            echo "[!] OMNIRUSH_AUTH nahi hai — 'login' mode chalao."
          fi

      - name: "[Linux] Install OmniRush CLI"
        if: inputs.os == 'linux' && inputs.install_omnirush == 'yes'
        shell: bash
        run: |
          npm install -g omnirush@latest
          omnirush --version || true

      - name: "[Linux] Tailscale"
        if: inputs.os == 'linux' && inputs.tailscale == 'yes'
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if [ -z "$TAILSCALE_AUTH_KEY" ]; then echo "[!] Key nahi hai, skip."; exit 0; fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname="or-linux-$GITHUB_RUN_ID" --accept-routes
          sleep 8
          echo "LINUX_TS_IP=$(tailscale ip -4 | head -1)" >> $GITHUB_ENV

      - name: "[Linux] Desktop in browser (noVNC)"
        if: inputs.os == 'linux' && inputs.mode == 'pc'
        shell: bash
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc novnc websockify fluxbox xterm
          Xvfb :99 -screen 0 1366x768x24 >/dev/null 2>&1 &
          sleep 3
          DISPLAY=:99 fluxbox >/dev/null 2>&1 &
          sleep 2
          x11vnc -display :99 -forever -shared -nopw -rfbport 5900 >/dev/null 2>&1 &
          sleep 2
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 >/dev/null 2>&1 &
          sleep 3
          echo "[OK] Linux desktop chalu :99 (noVNC port 6080)"

      - name: "[Linux] Login"
        if: inputs.os == 'linux' && inputs.mode == 'login'
        shell: bash
        run: |
          echo "=================================================="
          echo "  NEECHE EK LINK AAYEGA — phone ke Chrome mein"
          echo "  khol ke approve kar de"
          echo "=================================================="
          timeout 480 omnirush login 2>&1 | tee /tmp/login.log || true
          echo "=================================================="
          if [ -f "$HOME/.omnirush/auth.json" ]; then
            echo "[OK] LOGIN HO GAYA"
            echo "----- OMNIRUSH_AUTH (copy kar) -----"
            base64 -w0 "$HOME/.omnirush/auth.json"
            echo ""
            echo "----- copy khatam -----"
          else
            echo "[X] Login nahi hua:"; tail -30 /tmp/login.log
          fi

      - name: "[Linux] Run task"
        if: inputs.os == 'linux' && inputs.mode == 'task'
        shell: bash
        run: |
          if [ ! -f "$HOME/.omnirush/auth.json" ]; then
            echo "[X] Login nahi hai — pehle mode=login chalao."; exit 1
          fi
          echo "TASK: ${{ inputs.task }}"
          omnirush -p "${{ inputs.task }}" 2>&1 | tee omnirush-output.txt

      - name: "[Linux] Keep alive"
        if: inputs.os == 'linux' && inputs.mode == 'pc'
        shell: bash
        run: |
          echo "PC ${{ inputs.hours }} ghante chalu rahega."
          echo "Tailscale IP: ${{ env.LINUX_TS_IP }}"
          echo "Desktop (agar Tailscale ON hai): http://<tailscale-ip>:6080/vnc.html"
          end=$(( $(date +%s) + ${{ inputs.hours }} * 3600 ))
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 60; n=$((n+1))
            if [ $((n % 5)) -eq 0 ]; then
              echo "[alive $(date +%H:%M)] IP: $(tailscale ip -4 2>/dev/null | head -1)"
            fi
          done
          echo "Time khatam."

      # ============================================================
      #  ##############  W I N D O W S  ##############
      # ============================================================
      - name: "[Win] Enable Remote Desktop"
        if: inputs.os == 'windows' && inputs.mode == 'pc'
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "Remote Desktop ON."

      - name: "[Win] Create RDP user"
        if: inputs.os == 'windows' && inputs.mode == 'pc'
        shell: pwsh
        run: |
          $U='ABCDEFGHJKLMNPQRSTUVWXYZ'.ToCharArray(); $L='abcdefghijkmnpqrstuvwxyz'.ToCharArray()
          $N='23456789'.ToCharArray(); $S='@#%&*!'.ToCharArray(); $A=$U+$L+$N+$S
          $parts=@(); $parts+=($U|Get-Random); $parts+=($L|Get-Random)
          $parts+=($N|Get-Random); $parts+=($S|Get-Random)
          $parts+=(1..10|ForEach-Object{$A|Get-Random})
          $p=-join ($parts|Sort-Object{Get-Random})
          $secure=ConvertTo-SecureString $p -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) { Set-LocalUser -Name "RDP" -Password $secure }
          else { New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires | Out-Null }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          "RDP_PASS=$p" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "RDP user ready."

      - name: "[Win] Install Tailscale"
        if: inputs.os == 'windows' && inputs.tailscale == 'yes'
        shell: pwsh
        run: |
          $msi="$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i",$msi,"/quiet","/norestart" -Wait
          Remove-Item $msi -Force -ErrorAction SilentlyContinue
          Write-Host "Tailscale installed."

      - name: "[Win] Validate key + connect"
        if: inputs.os == 'windows' && inputs.tailscale == 'yes'
        shell: pwsh
        run: |
          $ts="$env:ProgramFiles\Tailscale\tailscale.exe"
          $k="${{ secrets.TAILSCALE_AUTH_KEY }}".Trim()
          $pcName="gh-pc-$env:GITHUB_RUN_ID"
          if ($k -notmatch '^tskey-auth-') {
            Write-Host "=========================================="
            Write-Host "  GALAT KEY!  'tskey-auth-...' chahiye."
            Write-Host "  (tu ne API token dala hai shayad)"
            Write-Host "=========================================="
            exit 0
          }
          & $ts "up" "--authkey=$k" "--hostname=$pcName" 2>&1 | Out-Host
          Start-Sleep -Seconds 12
          $ip = & $ts "ip" "-4" 2>$null | Select-String -Pattern '^100\.' | Select-Object -First 1
          if ($ip) { "TS_IP=$ip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          Write-Host "Tailscale IP: $ip"

      - name: "[Win] Install OmniRush GUI"
        if: inputs.os == 'windows' && inputs.install_omnirush == 'yes'
        shell: pwsh
        continue-on-error: true
        run: |
          $url=$null; $ver="unknown"
          try {
            $rel=Invoke-RestMethod -Uri "https://api.github.com/repos/omnirush-ai/omnirush-gui/releases/latest" -Headers @{"User-Agent"="AgentZero"} -TimeoutSec 60
            $ver=$rel.tag_name
            $asset=$rel.assets | Where-Object { $_.name -like "omnirush-win-x64-*.exe" -and $_.name -notlike "*.blockmap" } | Select-Object -First 1
            if ($asset) { $url=$asset.browser_download_url }
          } catch {}
          if (-not $url) {
            $url="https://github.com/omnirush-ai/omnirush-gui/releases/latest/download/omnirush-win-x64-2.2.17.exe"
            $ver="v2.2.17"
          }
          Write-Host "OmniRush $ver download ho raha hai..."
          $exe="$env:USERPROFILE\Desktop\OmniRush.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList "/S" -Wait
          Write-Host "OmniRush install ho gaya. Desktop pe shortcut hai."
          Start-Sleep -Seconds 5
          $gui=Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter "OmniRush*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($gui) { Start-Process $gui.FullName; Write-Host "OmniRush chalu kar diya." }

      - name: "[Win] Show connection details"
        if: inputs.os == 'windows' && inputs.mode == 'pc'
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "   TERRA WINDOWS PC TAIYAAR HAI"
          Write-Host "=========================================================="
          Write-Host "   USER     : RDP"
          Write-Host "   PASSWORD : $env:RDP_PASS"
          if ($env:TS_IP) { Write-Host "   ADDRESS  : $($env:TS_IP):3389" }
          Write-Host "   Desktop pe OmniRush ready hai."
          Write-Host "=========================================================="

      - name: "[Win] Keep alive"
        if: inputs.os == 'windows' && inputs.mode == 'pc'
        shell: pwsh
        run: |
          $ts="$env:ProgramFiles\Tailscale\tailscale.exe"
          $endAt=(Get-Date).AddHours(${{ inputs.hours }})
          Write-Host "PC ${{ inputs.hours }} ghante chalega, tab tak: $endAt"
          $n=0
          while ((Get-Date) -lt $endAt) {
            Start-Sleep -Seconds 60; $n++
            if ($n % 5 -eq 0) {
              $ip = & $ts "ip" "-4" 2>$null | Select-String -Pattern '^100\.' | Select-Object -First 1
              Write-Host "[alive $(Get-Date -Format HH:mm)] IP: $ip | user: RDP | pass: $env:RDP_PASS"
            }
          }
          Write-Host "Time khatam."

      # ============================================================
      #  COMMON — save session + artifacts
      # ============================================================
      - name: Save OmniRush session
        if: always() && inputs.os == 'linux'
        shell: bash
        run: |
          if [ -f "$HOME/.omnirush/auth.json" ]; then
            echo "Naye OMNIRUSH_AUTH ke liye:"; base64 -w0 "$HOME/.omnirush/auth.json"; echo ""
          fi

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omnirush-${{ inputs.os }}-${{ github.run_id }}
          path: |
            omnirush-output.txt
          if-no-files-found: ignore
          
