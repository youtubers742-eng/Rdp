name: Windows VNC

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Kitne ghante chalana hai (1-6)"
        required: true
        default: "5"
        type: choice
        options: ["1", "2", "3", "4", "5", "6"]

jobs:
  pc:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 1 - TightVNC Install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $vncPass = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 8 | ForEach-Object { [char]$_ })
          "VNC_PASS=$vncPass" | Out-File -FilePath $env:GITHUB_ENV -Append

          $props = "SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=$vncPass SET_ALLOWLOOPBACK=1 VALUE_OF_ALLOWLOOPBACK=1 SET_LOOPBACKONLY=1 VALUE_OF_LOOPBACKONLY=1 SET_ACCEPTHTTPCONNECTIONS=1 VALUE_OF_ACCEPTHTTPCONNECTIONS=0"
          choco install tightvnc -y --no-progress --install-arguments="$props"
          Start-Sleep -Seconds 5

          $svc = Get-Service tvnserver -ErrorAction SilentlyContinue
          if (-not $svc) { Write-Host "[ERROR] TightVNC service nahi mili, install fail hua"; exit 1 }

          $reg = "HKLM:\SOFTWARE\TightVNC\Server"
          if (Test-Path $reg) {
            Set-ItemProperty -Path $reg -Name AllowLoopback -Value 1 -Type DWord
            Set-ItemProperty -Path $reg -Name LoopbackOnly -Value 1 -Type DWord
          }
          Restart-Service tvnserver -Force

          $ok = $false
          for ($i = 0; $i -lt 15 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try {
              $c = New-Object Net.Sockets.TcpClient
              $c.Connect("127.0.0.1", 5900)
              $s = $c.GetStream()
              $s.ReadTimeout = 4000
              $b = New-Object byte[] 12
              $n = $s.Read($b, 0, 12)
              $banner = [Text.Encoding]::ASCII.GetString($b, 0, $n)
              $hello = [Text.Encoding]::ASCII.GetBytes("RFB 003.008" + [char]10)
              $s.Write($hello, 0, $hello.Length)
              $t = New-Object byte[] 1
              $null = $s.Read($t, 0, 1)
              $c.Close()
              if ($banner.StartsWith("RFB") -and $t[0] -gt 0) { $ok = $true }
            } catch { }
          }
          if ($ok) { Write-Host "[OK] VNC server chal raha hai aur connection accept kar raha hai" }
          else { Write-Host "[ERROR] VNC server connection accept nahi kar raha"; exit 1 }

      - name: 2 - noVNC + websockify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip" -OutFile "$env:RUNNER_TEMP\novnc.zip"
          Expand-Archive "$env:RUNNER_TEMP\novnc.zip" -DestinationPath "C:\" -Force
          $novncDir = "C:\noVNC-1.5.0"
          if (-not (Test-Path "$novncDir\vnc.html")) { Write-Host "[ERROR] noVNC files nahi mile"; exit 1 }
          "NOVNC_DIR=$novncDir" | Out-File -FilePath $env:GITHUB_ENV -Append

          python -m pip install --quiet websockify
          Start-Process -FilePath "python" -ArgumentList "-m", "websockify", "--web", $novncDir, "127.0.0.1:6080", "127.0.0.1:5900" -WindowStyle Hidden -RedirectStandardOutput "C:\websockify.log" -RedirectStandardError "C:\websockify.err.log"
          Start-Sleep -Seconds 5

          try {
            $r = Invoke-WebRequest "http://127.0.0.1:6080/vnc.html" -UseBasicParsing -TimeoutSec 10
            Write-Host "[OK] noVNC local page status: $($r.StatusCode)"
          } catch {
            Write-Host "[ERROR] noVNC page nahi khula"
            if (Test-Path "C:\websockify.err.log") { Get-Content "C:\websockify.err.log" -Tail 30 }
            exit 1
          }

      - name: 3 - Cloudflare Tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe"

          $url = $null
          for ($try = 1; $try -le 3 -and -not $url; $try++) {
            Write-Host "[INFO] Tunnel try $try"
            Remove-Item "C:\cf.log" -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList "tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://127.0.0.1:6080" -WindowStyle Hidden -PassThru -RedirectStandardOutput "C:\cf.out.log" -RedirectStandardError "C:\cf.log"
            for ($i = 0; $i -lt 30 -and -not $url; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path "C:\cf.log") {
                $m = Select-String -Path "C:\cf.log" -Pattern "https://(?!api\.)[a-z0-9-]+\.trycloudflare\.com" | Select-Object -First 1
                if ($m) { $url = $m.Matches[0].Value }
              }
            }
            if (-not $url) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

          if (-not $url) {
            Write-Host "[ERROR] Tunnel URL nahi mila. cf.log:"
            if (Test-Path "C:\cf.log") { Get-Content "C:\cf.log" -Tail 30 }
            exit 1
          }

          $live = $false
          for ($i = 0; $i -lt 30 -and -not $live; $i++) {
            Start-Sleep -Seconds 3
            try {
              $r = Invoke-WebRequest "$url/vnc.html" -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -eq 200) { $live = $true }
            } catch { }
          }
          Write-Host "[INFO] Public link live: $live"

          $link = "$url/vnc.html?autoconnect=true&resize=scale&password=$($env:VNC_PASS)"
          "VNC_LINK=$link" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "[OK] LINK: $link"

      - name: 4 - Connect Info
        if: always()
        shell: pwsh
        run: |
          $lines = @("## Windows VNC", "")
          if ($env:VNC_LINK) {
            $lines += "VNC Password: ``$($env:VNC_PASS)``"
            $lines += ""
            $lines += "Link browser me kholo (password link me already laga hai):"
            $lines += ""
            $lines += $env:VNC_LINK
          } else {
            $lines += "Link nahi bana. Upar ke steps me [ERROR] line dekho."
          }
          $text = $lines -join "`n"
          $text | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host $text

      - name: 5 - PC Zinda Rakho
        if: env.VNC_LINK != ''
        shell: pwsh
        run: |
          function Test-Port($port) {
            try { $c = New-Object Net.Sockets.TcpClient; $c.Connect("127.0.0.1", $port); $c.Close(); return $true } catch { return $false }
          }
          $end = (Get-Date).AddMinutes([int]"${{ inputs.hours }}" * 60)
          $n = 0
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
            $n++
            if ((Get-Service tvnserver).Status -ne 'Running') { Start-Service tvnserver }
            if (-not (Test-Port 6080)) {
              Write-Host "[WARN] websockify band tha, dobara chala raha hu"
              Start-Process -FilePath "python" -ArgumentList "-m", "websockify", "--web", $env:NOVNC_DIR, "127.0.0.1:6080", "127.0.0.1:5900" -WindowStyle Hidden
            }
            Write-Host "PC chal raha hai... $n minute"
            if ($n % 10 -eq 0) { Write-Host "LINK: $env:VNC_LINK" }
          }
          Write-Host "Time khatam. PC band ho raha hai."
